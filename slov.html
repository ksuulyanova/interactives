<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Словарные слова — игра</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    color: #333;
  }

  .game {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 32px;
    max-width: 640px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: 26px;
    color: #4a3f8f;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #888;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .progress-bar {
    height: 10px;
    background: #eee;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea, #764ba2);
    width: 0%;
    transition: width 0.4s ease;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: #666;
    margin-bottom: 24px;
  }

  .stats span b { color: #4a3f8f; }

  .word-box {
    background: #f7f7ff;
    border-radius: 16px;
    padding: 36px 20px;
    margin-bottom: 24px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .word {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #333;
    line-height: 1.4;
  }

  .word .missing {
    color: #e74c3c;
    border-bottom: 4px solid #e74c3c;
    padding: 0 6px;
  }

  .hint {
    font-size: 15px;
    color: #888;
    margin-bottom: 20px;
    min-height: 22px;
  }

  .options {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  .option-btn {
    padding: 18px 10px;
    font-size: 24px;
    font-weight: 700;
    border: 3px solid #ddd;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    transition: all 0.2s;
    color: #4a3f8f;
  }

  .option-btn:hover:not(:disabled) {
    border-color: #667eea;
    background: #f0f0ff;
    transform: translateY(-2px);
  }

  .option-btn.correct {
    border-color: #27ae60;
    background: #d4f8e0;
    color: #27ae60;
  }

  .option-btn.wrong {
    border-color: #e74c3c;
    background: #fde0e0;
    color: #e74c3c;
  }

  .option-btn:disabled { cursor: default; }

  .feedback {
    font-size: 20px;
    font-weight: 600;
    min-height: 30px;
    margin-bottom: 16px;
  }

  .feedback.ok { color: #27ae60; }
  .feedback.no { color: #e74c3c; }

  .next-btn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
    opacity: 0;
    pointer-events: none;
  }

  .next-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  .next-btn:hover { transform: scale(1.05); }

  .final-screen { display: none; }
  .final-screen.show { display: block; }

  .final-screen h2 {
    font-size: 28px;
    color: #4a3f8f;
    margin-bottom: 12px;
  }

  .final-screen p {
    font-size: 18px;
    color: #666;
    margin-bottom: 24px;
  }

  .final-screen .big-score {
    font-size: 56px;
    font-weight: 800;
    color: #667eea;
    margin-bottom: 16px;
  }

  .restart-btn {
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .restart-btn:hover { transform: scale(1.05); }

  .mode-select {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 16px;
  }

  .mode-btn {
    padding: 16px 24px;
    font-size: 17px;
    font-weight: 600;
    border: 3px solid #667eea;
    border-radius: 14px;
    background: #fff;
    color: #4a3f8f;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mode-btn:hover {
    background: #667eea;
    color: #fff;
    transform: translateY(-2px);
  }

  .total-info {
    font-size: 14px;
    color: #888;
    margin-top: 16px;
  }

  @media (max-width: 480px) {
    .game { padding: 20px; }
    .word { font-size: 28px; letter-spacing: 2px; }
    .option-btn { font-size: 20px; padding: 14px 6px; }
  }
</style>
</head>

<div class="game">

    </div>

    <p class="total-info" id="totalInfo"></p>
  </div>

  <!-- ИГРОВОЙ ЭКРАН -->
  <div id="gameScreen" style="display:none;">
    <h1>📚 Словарные слова</h1>
    <p class="subtitle">Выбери пропущенную букву</p>

</div>

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function findLetterIndex(word, letter) {
  const lower = word.toLowerCase();
  const idx = lower.indexOf(letter.toLowerCase());
  return idx === -1 ? 0 : idx;
}

function buildWordDisplay(word, letter) {
  const idx = findLetterIndex(word, letter);
  const before = word.slice(0, idx);
  const after = word.slice(idx + 1);
  return `${before}<span class="missing">?</span>${after}`;
}

function startGame(mode) {
  let pool;
  let count;

  if (mode === 'all') {
    pool = ALL_WORDS;
    count = ALL_WORDS.length;
  } else if (mode === 'grade2') {
    pool = [...WORDS_2_CLASS_1, ...WORDS_2_CLASS_2];
    count = pool.length;
  } else if (mode === 'grade3') {
    pool = [...WORDS_3_CLASS_1, ...WORDS_3_CLASS_2];
    count = pool.length;
  } else {
    pool = ALL_WORDS;
    count = mode;
  }

  const shuffled = shuffle(pool);
  currentQuestions = shuffled.slice(0, Math.min(count, pool.length));
  currentIndex = 0;
  score = 0;
  answered = false;

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
  document.getElementById("finalScreen").classList.remove("show");

  document.getElementById("qTotal").textContent = currentQuestions.length;
  document.getElementById("score").textContent = "0";

  showQuestion();
}

function showQuestion() {
  answered = false;
  const q = currentQuestions[currentIndex];

  const progress = (currentIndex / currentQuestions.length) * 100;
  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("qNum").textContent = currentIndex + 1;

  document.getElementById("wordDisplay").innerHTML = buildWordDisplay(q.word, q.letter);
  document.getElementById("hint").textContent = getHint(q.word) || "";

  const optionsDiv = document.getElementById("options");
  optionsDiv.innerHTML = "";
  q.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(btn, opt, q.letter);
    optionsDiv.appendChild(btn);
  });

  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("nextBtn").classList.remove("show");
  document.getElementById("nextBtn").textContent = (currentIndex === currentQuestions.length - 1)
    ? "Результат →" : "Далее →";
}

function checkAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;

  const isCorrect = chosen.toLowerCase() === correct.toLowerCase();
  const buttons = document.querySelectorAll(".option-btn");

  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent.toLowerCase() === correct.toLowerCase()) {
      b.classList.add("correct");
    }
  });

  if (isCorrect) {
    score++;
    document.getElementById("score").textContent = score;
    document.getElementById("feedback").textContent = "✅ Верно!";
    document.getElementById("feedback").className = "feedback ok";
  } else {
    btn.classList.add("wrong");
    document.getElementById("feedback").textContent = `❌ Ошибка! Правильно: «${correct}»`;
    document.getElementById("feedback").className = "feedback no";
  }

  document.getElementById("nextBtn").classList.add("show");
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    endGame();
  } else {
    showQuestion();
  }
}

function endGame() {
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("finalScreen").classList.add("show");

  const total = currentQuestions.length;
  document.getElementById("finalScore").textContent = `${score} / ${total}`;

  let msg = "";
  const pct = score / total;
  if (pct === 1) msg = "🏆 Отлично! Все слова знаешь наизусть!";
  else if (pct >= 0.8) msg = "🌟 Молодец! Очень хороший результат!";
  else if (pct >= 0.6) msg = "👍 Неплохо! Есть над чем поработать.";
  else if (pct >= 0.4) msg = "📖 Стоит повторить словарные слова.";
  else msg = "💪 Не сдавайся! Повтори слова и попробуй снова.";

  document.getElementById("finalMessage").textContent = msg;
}

function backToMenu() {
  document.getElementById("finalScreen").classList.remove("show");
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "block";
}
