<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хогвартс: Три испытания</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Georgia', 'Times New Roman', serif; }

    body {
        background-color: #0a1f14;
        background-image: url('https://i.pinimg.com/736x/1a/8c/32/1a8c32c1edc122942a4db2c973be0b97.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #f0e6c0;
        position: relative;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(10, 30, 20, 0.55) 0%, rgba(5, 15, 10, 0.9) 100%);
        pointer-events: none;
        z-index: 0;
    }

    .app {
        position: relative;
        z-index: 1;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 12px 18px;
        overflow: hidden;
    }

    /* ====== ОБЩИЕ ====== */
    .title {
        text-align: center;
        font-size: clamp(1.1rem, 2.2vw, 1.8rem);
        font-weight: 700;
        color: #fff3c4;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 14px rgba(184, 150, 62, 0.8), 2px 2px 0 rgba(0,0,0,0.6);
        margin-bottom: 6px;
        flex-shrink: 0;
    }
    .subtitle {
        text-align: center;
        font-size: clamp(0.8rem, 1.1vw, 1rem);
        color: #d4c48a;
        font-style: italic;
        margin-bottom: 10px;
        flex-shrink: 0;
    }

    .screen-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
        gap: 10px;
        flex-wrap: wrap;
    }
    .screen-title {
        font-size: clamp(0.95rem, 1.5vw, 1.3rem);
        font-weight: 700;
        color: #fff3c4;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(184, 150, 62, 0.8);
    }
    .back-btn {
        background: linear-gradient(145deg, #6b3a1a, #4a2410);
        border: 2px solid #b8963e;
        color: #f0e6c0;
        border-radius: 30px;
        padding: 8px 18px;
        font-size: clamp(0.75rem, 1vw, 0.9rem);
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 0.5px;
        transition: all 0.15s ease;
        box-shadow: 0 4px 0 #3a1a08;
    }
    .back-btn:hover { background: linear-gradient(145deg, #8a4a24, #6b3a1a); transform: translateY(-2px); box-shadow: 0 6px 0 #3a1a08; }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a1a08; }

    .btn {
        font-family: 'Georgia', serif;
        font-weight: 700;
        letter-spacing: 1px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
        border: 2px solid #b8963e;
        color: #f0e6c0;
        background: linear-gradient(145deg, #1a3d2a, #123322);
        box-shadow: 0 5px 0 #6b4f1d, 0 6px 12px rgba(0,0,0,0.3);
        padding: 12px 26px;
        font-size: clamp(0.9rem, 1.2vw, 1.05rem);
    }
    .btn:hover:not(:disabled) { background: linear-gradient(145deg, #23573b, #1a422b); transform: translateY(-2px); box-shadow: 0 7px 0 #6b4f1d; }
    .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #6b4f1d; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: translateY(3px); box-shadow: 0 2px 0 #6b4f1d; }
    .btn.gold {
        background: linear-gradient(145deg, #b8963e, #8a6d24);
        color: #1a2a1a;
        border-color: #6b4f1d;
        box-shadow: 0 5px 0 #4a3512;
    }
    .btn.gold:hover:not(:disabled) { background: linear-gradient(145deg, #d4b968, #a8852e); box-shadow: 0 7px 0 #4a3512; }
    .btn.gold:active:not(:disabled) { box-shadow: 0 1px 0 #4a3512; }

    /* ====== МЕНЮ С ДВЕРЯМИ ====== */
    .menu-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 0;
    }
    .doors {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: clamp(14px, 3vw, 45px);
        flex: 1;
        width: 100%;
        max-height: 65vh;
        padding: 10px;
    }
    .door-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        transition: transform 0.25s ease;
        flex: 0 1 220px;
        max-width: 240px;
    }
    .door-wrap:hover { transform: translateY(-10px); }
    .door {
        position: relative;
        width: 100%;
        height: clamp(200px, 38vh, 360px);
        border: 5px solid #6b4f1d;
        border-radius: 100px 100px 8px 8px;
        background: linear-gradient(180deg, #5a3a1a 0%, #3a2410 100%);
        box-shadow: 0 0 0 3px #b8963e, 0 12px 30px rgba(0,0,0,0.7), inset 0 0 60px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(3rem, 7vw, 5rem);
        overflow: hidden;
        transition: all 0.3s ease;
    }
    .door-wrap:hover .door {
        box-shadow: 0 0 0 3px #d4b968, 0 0 40px rgba(212, 185, 104, 0.6), 0 12px 30px rgba(0,0,0,0.7);
    }
    .door::before {
        content: '';
        position: absolute;
        inset: 6px;
        border-radius: 92px 92px 4px 4px;
        background: radial-gradient(ellipse at 50% 30%, rgba(255, 220, 130, 0.35), transparent 60%);
        opacity: 0;
        transition: opacity 0.4s ease;
    }
    .door-wrap:hover .door::before { opacity: 1; }
    .door::after {
        content: '';
        position: absolute;
        right: 16%;
        top: 55%;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd96b, #b8963e);
        box-shadow: 0 0 10px rgba(255, 217, 107, 0.8);
    }
    .door-emoji {
        position: relative;
        z-index: 2;
        filter: drop-shadow(0 0 12px rgba(255, 217, 107, 0.6));
        transition: transform 0.3s ease;
    }
    .door-wrap:hover .door-emoji { transform: scale(1.15); }
    .door-label {
        font-size: clamp(0.8rem, 1.1vw, 1rem);
        font-weight: 700;
        color: #fff3c4;
        text-align: center;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(184, 150, 62, 0.8), 2px 2px 0 rgba(0,0,0,0.7);
        background: rgba(10, 30, 20, 0.85);
        border: 2px solid #b8963e;
        border-radius: 20px;
        padding: 6px 14px;
    }
    .door-status {
        font-size: 0.75rem;
        color: #d4c48a;
        font-style: italic;
        letter-spacing: 0.5px;
    }
    .door-wrap.completed .door { filter: saturate(0.5) brightness(0.7); }
    .door-wrap.completed .door-label::after { content: ' ✓'; color: #4fd97a; text-shadow: 0 0 10px #4fd97a; }

    /* ====== ЭКРАНЫ ====== */
    .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }

    /* ====== ИСПЫТАНИЕ 1: АНАГРАММЫ ====== */
    .anagram-board {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: clamp(10px, 2.5vh, 24px);
        min-height: 0;
        padding: 8px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
    }
    .anagram-label {
        font-size: clamp(0.9rem, 1.2vw, 1.05rem);
        color: #d4c48a;
        font-style: italic;
        text-align: center;
        letter-spacing: 0.5px;
    }
    .anagram-letters {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: clamp(6px, 1vw, 12px);
    }
    .letter-tile {
        width: clamp(42px, 5.5vw, 66px);
        height: clamp(42px, 5.5vw, 66px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #f5ecd0 0%, #d4b968 100%);
        border: 3px solid #6b4f1d;
        border-radius: 10px;
        font-size: clamp(1.4rem, 2.4vw, 2rem);
        font-weight: 800;
        color: #2d1f0a;
        text-transform: uppercase;
        box-shadow: 0 5px 0 #4a3512, 0 6px 14px rgba(0,0,0,0.5);
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.15s ease;
        user-select: none;
    }
    .letter-tile:hover:not(.used) { transform: translateY(-3px); box-shadow: 0 8px 0 #4a3512; }
    .letter-tile:active:not(.used) { transform: translateY(2px); box-shadow: 0 3px 0 #4a3512; }
    .letter-tile.used { opacity: 0.25; pointer-events: none; }
    .answer-slots {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: clamp(6px, 1vw, 12px);
    }
    .slot {
        width: clamp(42px, 5.5vw, 66px);
        height: clamp(42px, 5.5vw, 66px);
        border: 3px dashed #b8963e;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 250, 230, 0.15);
        font-size: clamp(1.4rem, 2.4vw, 2rem);
        font-weight: 800;
        color: #fff3c4;
        text-transform: uppercase;
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .slot.filled {
        background: linear-gradient(160deg, #2a5a3a, #1a3d2a);
        border: 3px solid #4fd97a;
        box-shadow: 0 0 14px rgba(79, 217, 122, 0.5);
    }
    .slot.hint {
        border-color: #ffd96b;
        box-shadow: 0 0 14px rgba(255, 217, 107, 0.7);
    }
    .slot.done {
        background: linear-gradient(160deg, #2a5a3a, #1a3d2a);
        border: 3px solid #4fd97a;
        color: #ffd96b;
        box-shadow: 0 0 20px rgba(79, 217, 122, 0.8);
        animation: popSlot 0.5s ease;
    }
    @keyframes popSlot { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .anagram-hint {
        font-size: clamp(0.8rem, 1vw, 0.95rem);
        color: #d4c48a;
        font-style: italic;
        text-align: center;
        min-height: 1.4em;
    }
    .anagram-progress {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 6px;
    }
    .word-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #b8963e;
        background: transparent;
        transition: all 0.3s ease;
    }
    .word-dot.done {
        background: #4fd97a;
        box-shadow: 0 0 12px #4fd97a;
    }
    .word-dot.active {
        background: #ffd96b;
        box-shadow: 0 0 12px #ffd96b;
        transform: scale(1.3);
    }

    /* ====== ИСПЫТАНИЕ 2: СОСТАВЛЕНИЕ ====== */
    .compose-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 2vh, 18px);
        min-height: 0;
        padding: 8px;
        max-width: 950px;
        margin: 0 auto;
        width: 100%;
    }
    .compose-prompt {
        text-align: center;
        font-size: clamp(0.95rem, 1.3vw, 1.15rem);
        color: #fff3c4;
        font-weight: 700;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        text-shadow: 0 0 10px rgba(184, 150, 62, 0.5);
    }
    .drop-zone {
        min-height: clamp(70px, 12vh, 110px);
        border: 3px dashed #b8963e;
        border-radius: 14px;
        background: rgba(255, 250, 230, 0.12);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    .drop-zone.drag-over {
        border-color: #ffd96b;
        background: rgba(255, 217, 107, 0.2);
        box-shadow: inset 0 0 30px rgba(255, 217, 107, 0.3);
    }
    .drop-zone .placeholder {
        color: #a89878;
        font-style: italic;
        font-size: clamp(0.85rem, 1.1vw, 1rem);
    }
    .word-bank {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: center;
        gap: 10px;
        padding: 14px;
        background: rgba(10, 30, 20, 0.5);
        border: 2px solid #6b4f1d;
        border-radius: 14px;
        overflow-y: auto;
        min-height: 0;
    }
    .word-chip {
        background: linear-gradient(160deg, #f5ecd0 0%, #d4b968 100%);
        color: #2d1f0a;
        border: 3px solid #6b4f1d;
        border-radius: 10px;
        padding: clamp(8px, 1vw, 12px) clamp(14px, 1.6vw, 20px);
        font-size: clamp(0.9rem, 1.25vw, 1.1rem);
        font-weight: 700;
        font-family: 'Georgia', serif;
        cursor: grab;
        user-select: none;
        box-shadow: 0 4px 0 #4a3512, 0 5px 12px rgba(0,0,0,0.4);
        transition: all 0.15s ease;
        letter-spacing: 0.3px;
    }
    .word-chip:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #4a3512; }
    .word-chip:active { cursor: grabbing; transform: translateY(2px); box-shadow: 0 2px 0 #4a3512; }
    .word-chip.dragging { opacity: 0.45; }
    .word-chip.in-zone {
        background: linear-gradient(160deg, #2a5a3a, #1a3d2a);
        color: #fff3c4;
        border-color: #4fd97a;
        box-shadow: 0 4px 0 #0d3a1c, 0 0 12px rgba(79, 217, 122, 0.4);
    }
    .compose-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-shrink: 0;
    }

    /* ====== ИСПЫТАНИЕ 3: ПРАВДА/ЛОЖЬ ====== */
    .tf-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        gap: 8px;
        min-height: 0;
        padding: 6px;
        max-width: 950px;
        margin: 0 auto;
        width: 100%;
    }
    .tf-item {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.5vw, 18px);
        background: rgba(255, 250, 230, 0.1);
        border: 2px solid #6b4f1d;
        border-radius: 12px;
        padding: clamp(8px, 1.2vh, 14px) clamp(12px, 1.6vw, 20px);
        transition: all 0.2s ease;
        flex: 1;
        min-height: 0;
    }
    .tf-item:hover { background: rgba(255, 250, 230, 0.16); }
    .tf-item.correct {
        border-color: #4fd97a;
        background: rgba(79, 217, 122, 0.15);
        box-shadow: 0 0 16px rgba(79, 217, 122, 0.3);
    }
    .tf-item.wrong {
        border-color: #d44a3a;
        background: rgba(212, 74, 58, 0.15);
        box-shadow: 0 0 16px rgba(212, 74, 58, 0.3);
    }
    .tf-text {
        flex: 1;
        font-size: clamp(0.85rem, 1.2vw, 1.05rem);
        color: #f0e6c0;
        font-weight: 600;
        line-height: 1.3;
    }
    .tf-controls {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }
    .tf-btn {
        width: clamp(40px, 4.5vw, 52px);
        height: clamp(40px, 4.5vw, 52px);
        border-radius: 12px;
        border: 3px solid #6b4f1d;
        background: rgba(10, 30, 20, 0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.2rem, 1.7vw, 1.6rem);
        transition: all 0.15s ease;
        box-shadow: 0 4px 0 #4a3512;
        position: relative;
        color: #f0e6c0;
    }
    .tf-btn:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 6px 0 #4a3512; }
    .tf-btn:active:not(.locked) { transform: translateY(2px); box-shadow: 0 2px 0 #4a3512; }
    .tf-btn.locked { cursor: default; }
    .tf-btn.selected-true {
        background: linear-gradient(145deg, #1e6b3a, #14532a);
        border-color: #4fd97a;
        box-shadow: 0 4px 0 #0d3a1c, 0 0 18px rgba(79, 217, 122, 0.6);
    }
    .tf-btn.selected-false {
        background: linear-gradient(145deg, #6b1e1e, #4a1414);
        border-color: #d44a3a;
        box-shadow: 0 4px 0 #3a0d0d, 0 0 18px rgba(212, 74, 58, 0.6);
    }
    .tf-btn .check-mark {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #4fd97a;
        color: #0a1f14;
        font-size: 13px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 10px #4fd97a;
        animation: popIn 0.3s ease;
    }
    @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* ====== ФИНАЛ ====== */
    .victory-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
        padding: 20px;
    }
    .victory-crest {
        font-size: clamp(4rem, 10vw, 7rem);
        filter: drop-shadow(0 0 30px rgba(255, 217, 107, 0.9));
        animation: floatCrest 2.5s ease-in-out infinite;
    }
    @keyframes floatCrest { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    .victory-title {
        font-size: clamp(1.4rem, 3vw, 2.4rem);
        color: #fff3c4;
        text-transform: uppercase;
        letter-spacing: 3px;
        text-shadow: 0 0 20px rgba(184, 150, 62, 0.9), 3px 3px 0 rgba(0,0,0,0.6);
        font-weight: 800;
    }
    .victory-sub {
        font-size: clamp(0.9rem, 1.3vw, 1.15rem);
        color: #d4c48a;
        font-style: italic;
        max-width: 600px;
    }

    /* ====== ТОСТ ====== */
    .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(-140%);
        background: linear-gradient(145deg, #1a3d2a, #0f2a1c);
        border: 2px solid #b8963e;
        color: #fff3c4;
        padding: 12px 28px;
        border-radius: 30px;
        font-weight: 700;
        letter-spacing: 0.5px;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 30px rgba(184, 150, 62, 0.5);
        transition: transform 0.4s ease;
        font-size: clamp(0.85rem, 1.15vw, 1rem);
        text-align: center;
        max-width: 90vw;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: #4fd97a; box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 30px rgba(79, 217, 122, 0.6); }
    .toast.error { border-color: #d44a3a; box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 30px rgba(212, 74, 58, 0.6); }

    /* ====== АДАПТИВ ====== */
    @media (max-width: 720px) {
        .app { padding: 8px 10px; }
        .doors { gap: 10px; }
        .door-label { font-size: 0.7rem; padding: 5px 9px; }
        .door-status { font-size: 0.65rem; }
    }
    @media (max-width: 520px) {
        .doors { flex-direction: column; max-height: none; }
        .door-wrap { flex: 1; max-width: 100%; }
        .door { height: 24vh; }
    }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function() {
    // ========== ДАННЫЕ ==========
    const VOCAB_WORDS = ['ПЕНАЛ', 'МОРОЗ', 'КАРТИНА'];

    const SENTENCE_TASKS = [
        {
            prompt: 'Составь предложение: «У меня есть новый пенал.»',
            words: ['У', 'меня', 'есть', 'новый', 'пенал.'],
            answer: ['У', 'меня', 'есть', 'новый', 'пенал.']
        },
        {
            prompt: 'Составь предложение: «На улице сильный мороз.»',
            words: ['На', 'улице', 'сильный', 'мороз.'],
            answer: ['На', 'улице', 'сильный', 'мороз.']
        },
        {
            prompt: 'Составь предложение: «На стене висит красивая картина.»',
            words: ['На', 'стене', 'висит', 'красивая', 'картина.'],
            answer: ['На', 'стене', 'висит', 'красивая', 'картина.']
        }
    ];

    const TF_STATEMENTS = [
        { text: 'Слово «пенал» пишется с буквой «и» в первом слоге.', isTrue: false },
        { text: 'Слово «мороз» — словарное слово.', isTrue: true },
        { text: 'В слове «картина» три слога.', isTrue: true },
        { text: 'Слово «пенал» обозначает школьную принадлежность.', isTrue: true },
        { text: 'Слово «мороз» пишется с буквой «а» в корне.', isTrue: false },
        { text: 'Слово «картина» можно перенести как «кар-ти-на».', isTrue: false }
    ];

    // ========== СОСТОЯНИЕ ==========
    const state = {
        completed: { anagram: false, compose: false, truefalse: false },
        // Анаграммы
        anaWordIndex: 0,
        anaLetters: [],
        anaSlots: [],
        anaLetterUsed: [],
        anaSolvedWords: [],
        // Составление
        composeIndex: 0,
        composeZoneWords: [],
        composeBankWords: [],
        // Правда/ложь
        tfAnswers: {},
        tfLocked: false
    };

    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let toastTimeout = null;

    // ========== УТИЛИТЫ ==========
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function showToast(text, type = 'success') {
        toastEl.textContent = text;
        toastEl.className = 'toast show ' + type;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    // ========== МЕНЮ ==========
    function renderMenu() {
        const done = Object.values(state.completed).filter(Boolean).length;
        const allDone = done === 3;

        app.innerHTML = `
            <div class="menu-screen">
                <div class="title">⚡ Хогвартс: Три испытания ⚡</div>
                <div class="subtitle">Выбери дверь · Пройдено: ${done} из 3</div>
                <div class="doors">
                    ${renderDoor('anagram', '📜', 'Анаграммы', 'Собери словарные слова', state.completed.anagram)}
                    ${renderDoor('compose', '✍️', 'Предложения', 'Составь предложения из слов', state.completed.compose)}
                    ${renderDoor('truefalse', '⚖️', 'Правда и ложь', 'Расставь галочки', state.completed.truefalse)}
                </div>
                ${allDone ? `<button class="btn gold" id="victoryBtn" style="margin-top:6px;">🏆 Завершить обучение</button>` : ''}
            </div>
        `;

        document.querySelectorAll('.door-wrap').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.key;
                if (state.completed[key]) {
                    showToast('Это испытание уже пройдено!', 'success');
                    return;
                }
                if (key === 'anagram') startAnagram();
                if (key === 'compose') startCompose();
                if (key === 'truefalse') startTrueFalse();
            });
        });

        const vb = document.getElementById('victoryBtn');
        if (vb) vb.addEventListener('click', renderVictory);
    }

    function renderDoor(key, emoji, label, status, completed) {
        return `
            <div class="door-wrap ${completed ? 'completed' : ''}" data-key="${key}">
                <div class="door">
                    <span class="door-emoji">${emoji}</span>
                </div>
                <div class="door-label">${label}</div>
                <div class="door-status">${completed ? 'Пройдено ✓' : status}</div>
            </div>
        `;
    }

    // ============================================================
    // ========== ИСПЫТАНИЕ 1: АНАГРАММЫ ==========
    // ============================================================
    function startAnagram() {
        state.anaWordIndex = 0;
        state.anaSolvedWords = [];
        loadAnagramWord();
    }

    function loadAnagramWord() {
        if (state.anaWordIndex >= VOCAB_WORDS.length) {
            state.completed.anagram = true;
            showToast('Испытание «Анаграммы» пройдено! 🎉', 'success');
            renderAnagramSolved();
            return;
        }
        const word = VOCAB_WORDS[state.anaWordIndex];
        state.anaLetters = shuffle(word.split(''));
        state.anaSlots = new Array(word.length).fill(null);
        state.anaLetterUsed = new Array(word.length).fill(false);
        renderAnagram();
    }

    function renderAnagram() {
        const word = VOCAB_WORDS[state.anaWordIndex];
        const total = VOCAB_WORDS.length;

        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">📜 Испытание 1: Анаграммы</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="anagram-label">
                        Слово ${state.anaWordIndex + 1} из ${total}. Собери словарное слово из букв:
                    </div>
                    <div class="anagram-letters" id="lettersBox">
                        ${state.anaLetters.map((ch, i) => `
                            <div class="letter-tile ${state.anaLetterUsed[i] ? 'used' : ''}" data-idx="${i}">${ch}</div>
                        `).join('')}
                    </div>
                    <div class="anagram-label">Нажми на буквы, чтобы заполнить слово:</div>
                    <div class="answer-slots" id="slotsBox">
                        ${state.anaSlots.map((ch, i) => `
                            <div class="slot ${ch ? 'filled' : ''}" data-slot="${i}">${ch || ''}</div>
                        `).join('')}
                    </div>
                    <div class="anagram-hint" id="anaHint">Подсказка: ${getHint(state.anaWordIndex)}</div>
                    <div class="anagram-progress">
                        ${VOCAB_WORDS.map((_, i) => `<div class="word-dot ${state.anaSolvedWords[i] ? 'done' : (i === state.anaWordIndex ? 'active' : '')}"></div>`).join('')}
                    </div>
                    <button class="btn gold" id="anaCheck" style="margin-top:6px;">Проверить</button>
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);

        document.querySelectorAll('.letter-tile').forEach(tile => {
            tile.addEventListener('click', () => {
                const idx = parseInt(tile.dataset.idx);
                if (state.anaLetterUsed[idx]) return;
                const freeSlot = state.anaSlots.findIndex(s => s === null);
                if (freeSlot === -1) return;
                state.anaSlots[freeSlot] = state.anaLetters[idx];
                state.anaLetterUsed[idx] = true;
                renderAnagram();
            });
        });

        document.querySelectorAll('.slot').forEach(slot => {
            slot.addEventListener('click', () => {
                const i = parseInt(slot.dataset.slot);
                if (!state.anaSlots[i]) return;
                // Найти индекс использованной буквы с этим символом
                const ch = state.anaSlots[i];
                const usedIdx = state.anaLetters.findIndex((l, idx) => l === ch && state.anaLetterUsed[idx]);
                if (usedIdx !== -1) state.anaLetterUsed[usedIdx] = false;
                state.anaSlots[i] = null;
                renderAnagram();
            });
        });

        document.getElementById('anaCheck').addEventListener('click', checkAnagram);
    }

    function getHint(i) {
        const hints = ['Школьная принадлежность для ручек и карандашей.', 'Холодная зимняя погода.', 'Её вешают на стену.'];
        return hints[i] || '';
    }

    function checkAnagram() {
        if (state.anaSlots.some(s => s === null)) {
            showToast('Заполни все буквы!', 'error');
            return;
        }
        const word = VOCAB_WORDS[state.anaWordIndex];
        const assembled = state.anaSlots.join('');
        if (assembled === word) {
            state.anaSolvedWords[state.anaWordIndex] = true;
            showToast(`Верно! «${word}» ✨`, 'success');
            // Показать слово крупно
            const slotsBox = document.getElementById('slotsBox');
            if (slotsBox) {
                slotsBox.querySelectorAll('.slot').forEach(s => s.classList.add('done'));
            }
            setTimeout(() => {
                state.anaWordIndex++;
                loadAnagramWord();
            }, 1400);
        } else {
            showToast('Не то слово. Попробуй ещё!', 'error');
        }
    }

    function renderAnagramSolved() {
        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">📜 Испытание 1: Анаграммы</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="victory-crest" style="font-size:clamp(3rem,8vw,5rem);">📜</div>
                    <div class="screen-title">Все слова собраны!</div>
                    <div class="anagram-label" style="font-size:clamp(1rem,1.5vw,1.3rem); color:#ffd96b; font-style:normal;">
                        ${VOCAB_WORDS.join(' · ')}
                    </div>
                    <button class="btn gold" id="backBtn2" style="margin-top:14px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('backBtn2').addEventListener('click', renderMenu);
    }

    // ============================================================
    // ========== ИСПЫТАНИЕ 2: СОСТАВЛЕНИЕ ПРЕДЛОЖЕНИЙ ==========
    // ============================================================
    function startCompose() {
        state.composeIndex = 0;
        loadComposeTask();
    }

    function loadComposeTask() {
        if (state.composeIndex >= SENTENCE_TASKS.length) {
            state.completed.compose = true;
            showToast('Испытание «Предложения» пройдено! 🎉', 'success');
            renderComposeSolved();
            return;
        }
        const task = SENTENCE_TASKS[state.composeIndex];
        state.composeZoneWords = [];
        state.composeBankWords = shuffle([...task.words]);
        renderCompose();
    }

    function renderCompose() {
        const task = SENTENCE_TASKS[state.composeIndex];
        const total = SENTENCE_TASKS.length;

        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">✍️ Испытание 2: Предложения</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="compose-area">
                    <div class="compose-prompt">${task.prompt} (${state.composeIndex + 1} из ${total})</div>
                    <div class="drop-zone" id="dropZone">
                        ${state.composeZoneWords.length === 0
                            ? '<span class="placeholder">Перетащи сюда слова по порядку</span>'
                            : state.composeZoneWords.map((w, i) => `
                                <div class="word-chip in-zone" draggable="true" data-zone-idx="${i}">${w}</div>
                            `).join('')}
                    </div>
                    <div class="word-bank" id="wordBank">
                        ${state.composeBankWords.map((w, i) => `
                            <div class="word-chip" draggable="true" data-bank-idx="${i}">${w}</div>
                        `).join('')}
                    </div>
                    <div class="compose-actions">
                        <button class="btn" id="composeReset">↺ Сбросить</button>
                        <button class="btn gold" id="composeCheck">Проверить</button>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('composeReset').addEventListener('click', () => {
            state.composeZoneWords = [];
            state.composeBankWords = shuffle([...task.words]);
            renderCompose();
        });
        document.getElementById('composeCheck').addEventListener('click', checkCompose);

        setupDragDrop();
    }

    function setupDragDrop() {
        const dropZone = document.getElementById('dropZone');
        const bank = document.getElementById('wordBank');
        let draggedData = null;

        document.querySelectorAll('.word-chip').forEach(chip => {
            chip.addEventListener('dragstart', (e) => {
                chip.classList.add('dragging');
                if (chip.dataset.bankIdx !== undefined) {
                    draggedData = { from: 'bank', idx: parseInt(chip.dataset.bankIdx) };
                } else if (chip.dataset.zoneIdx !== undefined) {
                    draggedData = { from: 'zone', idx: parseInt(chip.dataset.zoneIdx) };
                }
                e.dataTransfer.effectAllowed = 'move';
            });
            chip.addEventListener('dragend', () => {
                chip.classList.remove('dragging');
            });

            // Мобильное перетаскивание: тап для перемещения
            chip.addEventListener('click', () => {
                if (chip.dataset.bankIdx !== undefined) {
                    const idx = parseInt(chip.dataset.bankIdx);
                    const word = state.composeBankWords[idx];
                    state.composeBankWords.splice(idx, 1);
                    state.composeZoneWords.push(word);
                    renderCompose();
                } else if (chip.dataset.zoneIdx !== undefined) {
                    const idx = parseInt(chip.dataset.zoneIdx);
                    const word = state.composeZoneWords[idx];
                    state.composeZoneWords.splice(idx, 1);
                    state.composeBankWords.push(word);
                    renderCompose();
                }
            });
        });

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (!draggedData) return;
            if (draggedData.from === 'bank') {
                const word = state.composeBankWords[draggedData.idx];
                state.composeBankWords.splice(draggedData.idx, 1);
                state.composeZoneWords.push(word);
            }
            draggedData = null;
            renderCompose();
        });

        bank.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        bank.addEventListener('drop', (e) => {
            e.preventDefault();
            if (!draggedData) return;
            if (draggedData.from === 'zone') {
                const word = state.composeZoneWords[draggedData.idx];
                state.composeZoneWords.splice(draggedData.idx, 1);
                state.composeBankWords.push(word);
            }
            draggedData = null;
            renderCompose();
        });
    }

    function checkCompose() {
        const task = SENTENCE_TASKS[state.composeIndex];
        if (state.composeZoneWords.length !== task.answer.length) {
            showToast('Используй все слова!', 'error');
            return;
        }
        const isCorrect = state.composeZoneWords.every((w, i) => w === task.answer[i]);
        if (isCorrect) {
            showToast('Верно! Молодец! ✨', 'success');
            setTimeout(() => {
                state.composeIndex++;
                loadComposeTask();
            }, 1200);
        } else {
            showToast('Порядок слов неверный. Попробуй ещё!', 'error');
        }
    }

    function renderComposeSolved() {
        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">✍️ Испытание 2: Предложения</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="victory-crest" style="font-size:clamp(3rem,8vw,5rem);">✍️</div>
                    <div class="screen-title">Все предложения составлены!</div>
                    <button class="btn gold" id="backBtn2" style="margin-top:14px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('backBtn2').addEventListener('click', renderMenu);
    }

    // ============================================================
    // ========== ИСПЫТАНИЕ 3: ПРАВДА/ЛОЖЬ ==========
    // ============================================================
    function startTrueFalse() {
        state.tfAnswers = {};
        state.tfLocked = false;
        renderTrueFalse();
    }

    function renderTrueFalse() {
        const total = TF_STATEMENTS.length;

        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">⚖️ Испытание 3: Правда и ложь</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="tf-list" id="tfList">
                    ${TF_STATEMENTS.map((st, i) => {
                        const sel = state.tfAnswers[i];
                        return `
                            <div class="tf-item" data-idx="${i}">
                                <div class="tf-text">${st.text}</div>
                                <div class="tf-controls">
                                    <div class="tf-btn ${sel === true ? 'selected-true' : ''} ${state.tfLocked ? 'locked' : ''}" data-idx="${i}" data-val="true" title="Правда">
                                        ✔
                                        ${sel === true ? '<div class="check-mark">✓</div>' : ''}
                                    </div>
                                    <div class="tf-btn ${sel === false ? 'selected-false' : ''} ${state.tfLocked ? 'locked' : ''}" data-idx="${i}" data-val="false" title="Ложь">
                                        ✘
                                        ${sel === false ? '<div class="check-mark">✓</div>' : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                <div class="compose-actions" style="margin-top:8px;">
                    ${!state.tfLocked
                        ? `<button class="btn gold" id="tfCheck">Проверить</button>`
                        : `<button class="btn gold" id="tfNext">В меню</button>`}
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);

        if (!state.tfLocked) {
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    const val = btn.dataset.val === 'true';
                    state.tfAnswers[idx] = val;
                    renderTrueFalse();
                });
            });
            document.getElementById('tfCheck').addEventListener('click', checkTrueFalse);
        } else {
            document.getElementById('tfNext').addEventListener('click', renderMenu);
        }
    }

    function checkTrueFalse() {
        const total = TF_STATEMENTS.length;
        if (Object.keys(state.tfAnswers).length < total) {
            showToast('Отметь галочками все утверждения!', 'error');
            return;
        }
        state.tfLocked = true;
        renderTrueFalse();
        // Подсветить правильные/неправильные
        setTimeout(() => {
            let allCorrect = true;
            document.querySelectorAll('.tf-item').forEach(item => {
                const idx = parseInt(item.dataset.idx);
                const userAns = state.tfAnswers[idx];
                const correct = TF_STATEMENTS[idx].isTrue;
                if (userAns === correct) {
                    item.classList.add('correct');
                } else {
                    item.classList.add('wrong');
                    allCorrect = false;
                }
            });
            if (allCorrect) {
                state.completed.truefalse = true;
                showToast('Все ответы верные! Испытание пройдено! 🎉', 'success');
            } else {
                showToast('Есть ошибки. Но ты можешь попробовать снова!', 'error');
                // Через 2.5 секунды разблокировать
                setTimeout(() => {
                    state.tfLocked = false;
                    // Оставляем ответы, чтобы можно было исправить
                    renderTrueFalse();
                }, 2500);
            }
        }, 100);
    }

    // ============================================================
    // ========== ФИНАЛ ==========
    // ============================================================
    function renderVictory() {
        app.innerHTML = `
            <div class="screen">
                <div class="victory-screen">
                    <div class="victory-crest">🏆</div>
                    <div class="victory-title">Все испытания пройдены!</div>
                    <div class="victory-sub">
                        Ты справился со словарными словами, составил предложения и отличил правду от лжи.
                        Хогвартс гордится тобой, юный волшебник! ⚡
                    </div>
                    <button class="btn gold" id="toMenu" style="margin-top:12px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('toMenu').addEventListener('click', renderMenu);
    }

    // ========== СТАРТ ==========
    renderMenu();
})();
</script>
</body>
</html>
