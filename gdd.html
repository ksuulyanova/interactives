<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хогвартс: Четыре испытания</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; font-family: 'Georgia', 'Times New Roman', serif; }

    body {
        background-color: #0a1f14;
        background-image: url('https://i.pinimg.com/736x/1a/8c/32/1a8c32c1edc122942a4db2c973be0b97.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        color: #f0e6c0;
        position: relative;
    }
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(10, 30, 20, 0.55) 0%, rgba(5, 15, 10, 0.9) 100%);
        pointer-events: none;
        z-index: 0;
    }

    .app {
        position: relative;
        z-index: 1;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 12px 18px;
        overflow: hidden;
    }

    .title {
        text-align: center;
        font-size: clamp(1.1rem, 2.2vw, 1.8rem);
        font-weight: 700;
        color: #fff3c4;
        letter-spacing: 2px;
        text-transform: uppercase;
        text-shadow: 0 0 14px rgba(184, 150, 62, 0.8), 2px 2px 0 rgba(0,0,0,0.6);
        margin-bottom: 6px;
        flex-shrink: 0;
    }
    .subtitle {
        text-align: center;
        font-size: clamp(0.8rem, 1.1vw, 1rem);
        color: #d4c48a;
        font-style: italic;
        margin-bottom: 10px;
        flex-shrink: 0;
    }

    .screen-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        flex-shrink: 0;
        gap: 10px;
        flex-wrap: wrap;
    }
    .screen-title {
        font-size: clamp(0.95rem, 1.5vw, 1.3rem);
        font-weight: 700;
        color: #fff3c4;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(184, 150, 62, 0.8);
    }
    .back-btn {
        background: linear-gradient(145deg, #6b3a1a, #4a2410);
        border: 2px solid #b8963e;
        color: #f0e6c0;
        border-radius: 30px;
        padding: 8px 18px;
        font-size: clamp(0.75rem, 1vw, 0.9rem);
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        letter-spacing: 0.5px;
        transition: all 0.15s ease;
        box-shadow: 0 4px 0 #3a1a08;
    }
    .back-btn:hover { background: linear-gradient(145deg, #8a4a24, #6b3a1a); transform: translateY(-2px); box-shadow: 0 6px 0 #3a1a08; }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #3a1a08; }

    .btn {
        font-family: 'Georgia', serif;
        font-weight: 700;
        letter-spacing: 1px;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
        border: 2px solid #b8963e;
        color: #f0e6c0;
        background: linear-gradient(145deg, #1a3d2a, #123322);
        box-shadow: 0 5px 0 #6b4f1d, 0 6px 12px rgba(0,0,0,0.3);
        padding: 12px 26px;
        font-size: clamp(0.9rem, 1.2vw, 1.05rem);
    }
    .btn:hover:not(:disabled) { background: linear-gradient(145deg, #23573b, #1a422b); transform: translateY(-2px); box-shadow: 0 7px 0 #6b4f1d; }
    .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #6b4f1d; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: translateY(3px); box-shadow: 0 2px 0 #6b4f1d; }
    .btn.gold {
        background: linear-gradient(145deg, #b8963e, #8a6d24);
        color: #1a2a1a;
        border-color: #6b4f1d;
        box-shadow: 0 5px 0 #4a3512;
    }
    .btn.gold:hover:not(:disabled) { background: linear-gradient(145deg, #d4b968, #a8852e); box-shadow: 0 7px 0 #4a3512; }
    .btn.gold:active:not(:disabled) { box-shadow: 0 1px 0 #4a3512; }

    /* ====== МЕНЮ С ДВЕРЯМИ ====== */
    .menu-screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 0;
    }
    .doors {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: clamp(10px, 2vw, 30px);
        flex: 1;
        width: 100%;
        max-height: 68vh;
        padding: 10px;
        flex-wrap: wrap;
    }
    .door-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.25s ease;
        flex: 0 1 180px;
        max-width: 200px;
    }
    .door-wrap:hover { transform: translateY(-10px); }

    .door {
        position: relative;
        width: 100%;
        height: clamp(190px, 36vh, 340px);
        border: 5px solid #6b4f1d;
        border-radius: 100px 100px 8px 8px;
        background: linear-gradient(180deg, #5a3a1a 0%, #3a2410 100%);
        box-shadow: 0 0 0 3px #b8963e, 0 12px 30px rgba(0,0,0,0.7), inset 0 0 60px rgba(0,0,0,0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: all 0.3s ease;
    }
    .door-wrap:hover .door {
        box-shadow: 0 0 0 3px #d4b968, 0 0 40px rgba(212, 185, 104, 0.6), 0 12px 30px rgba(0,0,0,0.7);
    }
    .door::before {
        content: '';
        position: absolute;
        inset: 6px;
        border-radius: 92px 92px 4px 4px;
        background: radial-gradient(ellipse at 50% 30%, rgba(255, 220, 130, 0.35), transparent 60%);
        opacity: 0;
        transition: opacity 0.4s ease;
    }
    .door-wrap:hover .door::before { opacity: 1; }
    .door::after {
        content: '';
        position: absolute;
        right: 14%;
        top: 55%;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd96b, #b8963e);
        box-shadow: 0 0 10px rgba(255, 217, 107, 0.8);
    }

    .door-svg {
        width: 62%;
        height: auto;
        position: relative;
        z-index: 2;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        filter: drop-shadow(0 0 12px rgba(255, 217, 107, 0.55));
        transition: transform 0.3s ease;
    }
    .door-wrap:hover .door-svg { transform: scale(1.08); }

    .door-label {
        font-size: clamp(0.75rem, 1vw, 0.95rem);
        font-weight: 700;
        color: #fff3c4;
        text-align: center;
        letter-spacing: 1px;
        text-transform: uppercase;
        text-shadow: 0 0 10px rgba(184, 150, 62, 0.8), 2px 2px 0 rgba(0,0,0,0.7);
        background: rgba(10, 30, 20, 0.85);
        border: 2px solid #b8963e;
        border-radius: 20px;
        padding: 5px 12px;
    }
    .door-status {
        font-size: 0.7rem;
        color: #d4c48a;
        font-style: italic;
        letter-spacing: 0.5px;
        text-align: center;
    }
    .door-wrap.completed .door { filter: saturate(0.5) brightness(0.7); }
    .door-wrap.completed .door-label::after { content: ' ✓'; color: #4fd97a; text-shadow: 0 0 10px #4fd97a; }

    /* ====== ЭКРАНЫ ====== */
    .screen {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
    }

    /* ====== ИСПЫТАНИЕ 1 ====== */
    .anagram-board {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: clamp(10px, 2.5vh, 24px);
        min-height: 0;
        padding: 8px;
        max-width: 900px;
        margin: 0 auto;
        width: 100%;
    }
    .anagram-label {
        font-size: clamp(0.9rem, 1.2vw, 1.05rem);
        color: #d4c48a;
        font-style: italic;
        text-align: center;
        letter-spacing: 0.5px;
    }
    .anagram-letters {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: clamp(6px, 1vw, 12px);
    }
    .letter-tile {
        width: clamp(42px, 5.5vw, 66px);
        height: clamp(42px, 5.5vw, 66px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #f5ecd0 0%, #d4b968 100%);
        border: 3px solid #6b4f1d;
        border-radius: 10px;
        font-size: clamp(1.4rem, 2.4vw, 2rem);
        font-weight: 800;
        color: #2d1f0a;
        text-transform: uppercase;
        box-shadow: 0 5px 0 #4a3512, 0 6px 14px rgba(0,0,0,0.5);
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.15s ease;
        user-select: none;
    }
    .letter-tile:hover:not(.used) { transform: translateY(-3px); box-shadow: 0 8px 0 #4a3512; }
    .letter-tile:active:not(.used) { transform: translateY(2px); box-shadow: 0 3px 0 #4a3512; }
    .letter-tile.used { opacity: 0.25; pointer-events: none; }
    .answer-slots {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: clamp(6px, 1vw, 12px);
    }
    .slot {
        width: clamp(42px, 5.5vw, 66px);
        height: clamp(42px, 5.5vw, 66px);
        border: 3px dashed #b8963e;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 250, 230, 0.15);
        font-size: clamp(1.4rem, 2.4vw, 2rem);
        font-weight: 800;
        color: #fff3c4;
        text-transform: uppercase;
        font-family: 'Georgia', serif;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .slot.filled {
        background: linear-gradient(160deg, #2a5a3a, #1a3d2a);
        border: 3px solid #4fd97a;
        box-shadow: 0 0 14px rgba(79, 217, 122, 0.5);
    }
    .slot.done {
        background: linear-gradient(160deg, #2a5a3a, #1a3d2a);
        border: 3px solid #4fd97a;
        color: #ffd96b;
        box-shadow: 0 0 20px rgba(79, 217, 122, 0.8);
        animation: popSlot 0.5s ease;
    }
    @keyframes popSlot { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }

    .anagram-hint {
        font-size: clamp(0.8rem, 1vw, 0.95rem);
        color: #d4c48a;
        font-style: italic;
        text-align: center;
        min-height: 1.4em;
    }
    .anagram-progress {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 6px;
    }
    .word-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #b8963e;
        background: transparent;
        transition: all 0.3s ease;
    }
    .word-dot.done { background: #4fd97a; box-shadow: 0 0 12px #4fd97a; }
    .word-dot.active { background: #ffd96b; box-shadow: 0 0 12px #ffd96b; transform: scale(1.3); }

    /* ====== ИСПЫТАНИЕ 2 ====== */
    .compose-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: clamp(10px, 2vh, 18px);
        min-height: 0;
        padding: 8px;
        max-width: 950px;
        margin: 0 auto;
        width: 100%;
    }
    .compose-prompt {
        text-align: center;
        font-size: clamp(0.95rem, 1.3vw, 1.15rem);
        color: #fff3c4;
        font-weight: 700;
        letter-spacing: 0.5px;
        flex-shrink: 0;
        text-shadow: 0 0 10px rgba(184, 150, 62, 0.5);
    }
    .drop-zone {
        min-height: clamp(70px, 12vh, 110px);
        border: 3px dashed #b8963e;
        border-radius: 14px;
        background: rgba(255, 250, 230, 0.12);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 12px;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }
    .drop-zone.drag-over {
        border-color: #ffd96b;
        background: rgba(255, 217, 107, 0.2);
        box-shadow: inset 0 0 30px rgba(255, 217, 107, 0.3);
    }
    .drop-zone .placeholder {
        color: #a89878;
        font-style: italic;
        font-size: clamp(0.85rem, 1.1vw, 1rem);
    }
    .word-bank {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        justify-content: center;
        gap: 10px;
        padding: 14px;
        background: rgba(10, 30, 20, 0.5);
        border: 2px solid #6b4f1d;
        border-radius: 14px;
        overflow-y: auto;
        min-height: 0;
    }
    .word-chip {
        background: linear-gradient(160deg, #f5ecd0 0%, #d4b968 100%);
        color: #2d1f0a;
        border: 3px solid #6b4f1d;
        border-radius: 10px;
        padding: clamp(8px, 1vw, 12px) clamp(14px, 1.6vw, 20px);
        font-size: clamp(0.9rem, 1.25vw, 1.1rem);
        font-weight: 700;
        font-family: 'Georgia', serif;
        cursor: grab;
        user-select: none;
        box-shadow: 0 4px 0 #4a3512, 0 5px 12px rgba(0,0,0,0.4);
        transition: all 0.15s ease;
        letter-spacing: 0.3px;
    }
    .word-chip:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #4a3512; }
    .word-chip:active { cursor: grabbing; transform: translateY(2px); box-shadow: 0 2px 0 #4a3512; }
    .word-chip.dragging { opacity: 0.45; }
    .word-chip.in-zone {
        background: linear-gradient(160deg, #2a5a3a, #1a3d2a);
        color: #fff3c4;
        border-color: #4fd97a;
        box-shadow: 0 4px 0 #0d3a1c, 0 0 12px rgba(79, 217, 122, 0.4);
    }
    .compose-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-shrink: 0;
    }

    /* ====== ИСПЫТАНИЕ 3 ====== */
    .tf-list {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-evenly;
        gap: 8px;
        min-height: 0;
        padding: 6px;
        max-width: 950px;
        margin: 0 auto;
        width: 100%;
    }
    .tf-item {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.5vw, 18px);
        background: rgba(255, 250, 230, 0.1);
        border: 2px solid #6b4f1d;
        border-radius: 12px;
        padding: clamp(8px, 1.2vh, 14px) clamp(12px, 1.6vw, 20px);
        transition: all 0.2s ease;
        flex: 1;
        min-height: 0;
    }
    .tf-item:hover { background: rgba(255, 250, 230, 0.16); }
    .tf-item.correct {
        border-color: #4fd97a;
        background: rgba(79, 217, 122, 0.15);
        box-shadow: 0 0 16px rgba(79, 217, 122, 0.3);
    }
    .tf-item.wrong {
        border-color: #d44a3a;
        background: rgba(212, 74, 58, 0.15);
        box-shadow: 0 0 16px rgba(212, 74, 58, 0.3);
    }
    .tf-text {
        flex: 1;
        font-size: clamp(0.85rem, 1.2vw, 1.05rem);
        color: #f0e6c0;
        font-weight: 600;
        line-height: 1.3;
    }
    .tf-controls { display: flex; gap: 8px; flex-shrink: 0; }
    .tf-btn {
        width: clamp(40px, 4.5vw, 52px);
        height: clamp(40px, 4.5vw, 52px);
        border-radius: 12px;
        border: 3px solid #6b4f1d;
        background: rgba(10, 30, 20, 0.6);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1.2rem, 1.7vw, 1.6rem);
        transition: all 0.15s ease;
        box-shadow: 0 4px 0 #4a3512;
        position: relative;
        color: #f0e6c0;
    }
    .tf-btn:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 6px 0 #4a3512; }
    .tf-btn:active:not(.locked) { transform: translateY(2px); box-shadow: 0 2px 0 #4a3512; }
    .tf-btn.locked { cursor: default; }
    .tf-btn.selected-true {
        background: linear-gradient(145deg, #1e6b3a, #14532a);
        border-color: #4fd97a;
        box-shadow: 0 4px 0 #0d3a1c, 0 0 18px rgba(79, 217, 122, 0.6);
    }
    .tf-btn.selected-false {
        background: linear-gradient(145deg, #6b1e1e, #4a1414);
        border-color: #d44a3a;
        box-shadow: 0 4px 0 #3a0d0d, 0 0 18px rgba(212, 74, 58, 0.6);
    }
    .tf-btn .check-mark {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #4fd97a;
        color: #0a1f14;
        font-size: 13px;
        font-weight: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 10px #4fd97a;
        animation: popIn 0.3s ease;
    }
    @keyframes popIn { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }

    /* ====== ИСПЫТАНИЕ 4: КОЛЕСО ФОРТУНЫ ====== */
    .wheel-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        gap: clamp(8px, 1.5vh, 16px);
        min-height: 0;
        padding: 6px;
        max-width: 950px;
        margin: 0 auto;
        width: 100%;
    }

    .wheel-top {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
    }

    .wheel-hint {
        font-size: clamp(0.85rem, 1.15vw, 1.05rem);
        color: #d4c48a;
        font-style: italic;
        text-align: center;
        letter-spacing: 0.5px;
    }

    .wheel-container {
        position: relative;
        width: clamp(200px, 32vh, 320px);
        height: clamp(200px, 32vh, 320px);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .wheel-pointer {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 16px solid transparent;
        border-right: 16px solid transparent;
        border-top: 28px solid #b8963e;
        filter: drop-shadow(0 0 8px rgba(255, 217, 107, 0.9)) drop-shadow(0 2px 3px rgba(0,0,0,0.6));
        z-index: 10;
    }
    .wheel-pointer::after {
        content: '';
        position: absolute;
        top: -22px;
        left: -10px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd96b, #b8963e);
        box-shadow: 0 0 12px rgba(255, 217, 107, 0.9);
    }

    .wheel {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 6px solid #6b4f1d;
        box-shadow:
            0 0 0 3px #b8963e,
            0 0 0 8px #4a3512,
            0 12px 40px rgba(0,0,0,0.7),
            inset 0 0 40px rgba(0,0,0,0.5);
        transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        background: #1a3d2a;
        overflow: hidden;
    }

    .wheel svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    .wheel-hub {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 22%;
        height: 22%;
        border-radius: 50%;
        background: radial-gradient(circle, #ffd96b 0%, #b8963e 60%, #6b4f1d 100%);
        border: 3px solid #6b4f1d;
        box-shadow: 0 0 20px rgba(255, 217, 107, 0.7), inset 0 -3px 6px rgba(0,0,0,0.4);
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(1rem, 1.6vw, 1.5rem);
        color: #4a3512;
        font-weight: 900;
        font-family: 'Georgia', serif;
    }

    .wheel-spin-btn {
        padding: 10px 34px;
        font-size: clamp(0.9rem, 1.2vw, 1.05rem);
        flex-shrink: 0;
    }
    .wheel-spin-btn:disabled { opacity: 0.5; }

    /* Карточка задания */
    .task-card {
        width: 100%;
        max-width: 720px;
        background: linear-gradient(160deg, #f5ecd0 0%, #ede0bd 100%);
        border: 3px solid #b8963e;
        border-radius: 14px;
        padding: clamp(10px, 1.8vh, 20px) clamp(14px, 2vw, 26px);
        box-shadow: 0 8px 0 #6b4f1d, 0 10px 25px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: clamp(8px, 1.4vh, 14px);
        color: #2d1f0a;
        animation: slideUp 0.4s ease;
    }

    @keyframes slideUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .task-label {
        font-size: clamp(0.75rem, 1vw, 0.9rem);
        color: #6b4f1d;
        font-style: italic;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        font-weight: 700;
    }

    .task-word {
        font-size: clamp(1.6rem, 3.5vw, 2.6rem);

<script>
(function() {
    // ========== ДАННЫЕ ==========
    const VOCAB_WORDS = ['ПЕНАЛ', 'МОРОЗ', 'КАРТИНА'];

    const SENTENCE_TASKS = [

    // Колесо Фортуны — 8 секторов с орфографическими заданиями
    const WHEEL_TASKS = [
        { display: 'П_НАЛ',    full: 'ПЕНАЛ',    missing: 'Е', options: ['Е', 'И', 'Я'], hint: 'Школьная принадлежность для ручек и карандашей.' },

        quill: `
            <svg viewBox="0 0 16 16" class="door-svg" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">

                <rect x="12" y="4" width="3" height="2" fill="#1a3d2a"/>

        wheel: `

                <!-- внешнее кольцо -->
                <rect x="2" y="2" width="12" height="1" fill="#6b4f1d"/>
                <rect x="2" y="13" width="12" height="1" fill="#6b4f1d"/>
                <rect x="2" y="2" width="1" height="12" fill="#6b4f1d"/>

                <!-- внутреннее кольцо (золото) -->
                <rect x="3" y="3" width="10" height="1" fill="#d4b968"/>
                <rect x="3" y="12" width="10" height="1" fill="#d4b968"/>
                <rect x="3" y="3" width="1" height="10" fill="#d4b968"/>
                <rect x="12" y="3" width="1" height="10" fill="#d4b968"/>
                <!-- спицы -->
                <rect x="7" y="4" width="2" height="8" fill="#1a3d2a"/>
                <rect x="4" y="7" width="8" height="2" fill="#1a3d2a"/>
                <!-- втулка -->
                <rect x="6" y="6" width="4" height="4" fill="#ffd96b"/>
                <rect x="7" y="7" width="2" height="2" fill="#6b4f1d"/>
                <!-- стрелка сверху -->
                <rect x="7" y="0" width="2" height="2" fill="#b8963e"/>

                <!-- цветные сектора по углам -->
                <rect x="4" y="4" width="1" height="1" fill="#b33a2a"/>

                <rect x="4" y="11" width="1" height="1" fill="#1e6b3a"/>
                <rect x="11" y="11" width="1" height="1" fill="#b33a2a"/>
            </svg>
        `
    };

    // ========== СОСТОЯНИЕ ==========
    const state = {
        completed: { anagram: false, compose: false, truefalse: false, wheel: false },
        anaWordIndex: 0,
        anaLetters: [],
        anaSlots: [],
        anaLetterUsed: [],
        anaSolvedWords: [],
        composeIndex: 0,
        composeZoneWords: [],
        composeBankWords: [],
        tfAnswers: {},
        tfLocked: false,
        // Колесо
        wheelRotation: 0,
        wheelSpinning: false,
        wheelTask: null,       // текущее задание
        wheelAnswered: false,  // дан ли ответ
        wheelSolved: 0         // сколько заданий решено
    };

    const WHEEL_TARGET = 3; // сколько заданий надо решить, чтобы пройти испытание

    const app = document.getElementById('app');
    const toastEl = document.getElementById('toast');
    let toastTimeout = null;

    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function showToast(text, type = 'success') {
        toastEl.textContent = text;
        toastEl.className = 'toast show ' + type;
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    // ========== МЕНЮ ==========
    function renderMenu() {
        const done = Object.values(state.completed).filter(Boolean).length;
        const allDone = done === 4;

        app.innerHTML = `
            <div class="menu-screen">
                <div class="title">⚡ Хогвартс: Четыре испытания ⚡</div>
                <div class="subtitle">Выбери дверь · Пройдено: ${done} из 4</div>
                <div class="doors">
                    ${renderDoor('anagram', PIXEL_SPRITES.scroll, 'Анаграммы', 'Собери словарные слова', state.completed.anagram)}
                    ${renderDoor('compose', PIXEL_SPRITES.quill, 'Предложения', 'Составь предложения', state.completed.compose)}
                    ${renderDoor('truefalse', PIXEL_SPRITES.scales, 'Правда и ложь', 'Расставь галочки', state.completed.truefalse)}
                    ${renderDoor('wheel', PIXEL_SPRITES.wheel, 'Колесо Фортуны', 'Орфография', state.completed.wheel)}
                </div>
                ${allDone ? `<button class="btn gold" id="victoryBtn" style="margin-top:6px;">🏆 Завершить обучение</button>` : ''}
            </div>
        `;

        document.querySelectorAll('.door-wrap').forEach(el => {
            el.addEventListener('click', () => {
                const key = el.dataset.key;
                if (state.completed[key]) { showToast('Это испытание уже пройдено!', 'success'); return; }
                if (key === 'anagram') startAnagram();
                if (key === 'compose') startCompose();
                if (key === 'truefalse') startTrueFalse();
                if (key === 'wheel') startWheel();
            });
        });

        const vb = document.getElementById('victoryBtn');
        if (vb) vb.addEventListener('click', renderVictory);
    }

    function renderDoor(key, spriteSVG, label, status, completed) {
        return `
            <div class="door-wrap ${completed ? 'completed' : ''}" data-key="${key}">
                <div class="door">${spriteSVG}</div>
                <div class="door-label">${label}</div>
                <div class="door-status">${completed ? 'Пройдено ✓' : status}</div>
            </div>
        `;
    }

    // ========== ИСПЫТАНИЕ 1: АНАГРАММЫ ==========
    function startAnagram() {
        state.anaWordIndex = 0;
        state.anaSolvedWords = [];
        loadAnagramWord();
    }

    function loadAnagramWord() {
        if (state.anaWordIndex >= VOCAB_WORDS.length) {
            state.completed.anagram = true;
            showToast('Испытание «Анаграммы» пройдено! 🎉', 'success');
            renderAnagramSolved();
            return;
        }
        const word = VOCAB_WORDS[state.anaWordIndex];
        state.anaLetters = shuffle(word.split(''));
        state.anaSlots = new Array(word.length).fill(null);
        state.anaLetterUsed = new Array(word.length).fill(false);
        renderAnagram();
    }

    function renderAnagram() {
        const word = VOCAB_WORDS[state.anaWordIndex];
        const total = VOCAB_WORDS.length;

        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">📜 Испытание 1: Анаграммы</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="anagram-label">Слово ${state.anaWordIndex + 1} из ${total}. Собери словарное слово из букв:</div>
                    <div class="anagram-letters" id="lettersBox">

                    <div class="anagram-label">Нажми на буквы, чтобы заполнить слово:</div>
                    <div class="answer-slots" id="slotsBox">
                        ${state.anaSlots.map((ch, i) => `<div class="slot ${ch ? 'filled' : ''}" data-slot="${i}">${ch || ''}</div>`).join('')}
                    </div>
                    <div class="anagram-hint" id="anaHint">Подсказка: ${getHint(state.anaWordIndex)}</div>
                    <div class="anagram-progress">
                        ${VOCAB_WORDS.map((_, i) => `<div class="word-dot ${state.anaSolvedWords[i] ? 'done' : (i === state.anaWordIndex ? 'active' : '')}"></div>`).join('')}
                    </div>
                    <button class="btn gold" id="anaCheck" style="margin-top:6px;">Проверить</button>
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);

        document.querySelectorAll('.letter-tile').forEach(tile => {
            tile.addEventListener('click', () => {
                const idx = parseInt(tile.dataset.idx);
                if (state.anaLetterUsed[idx]) return;
                const freeSlot = state.anaSlots.findIndex(s => s === null);
                if (freeSlot === -1) return;
                state.anaSlots[freeSlot] = state.anaLetters[idx];
                state.anaLetterUsed[idx] = true;
                renderAnagram();
            });
        });

        document.querySelectorAll('.slot').forEach(slot => {
            slot.addEventListener('click', () => {
                const i = parseInt(slot.dataset.slot);
                if (!state.anaSlots[i]) return;
                const ch = state.anaSlots[i];
                const usedIdx = state.anaLetters.findIndex((l, idx) => l === ch && state.anaLetterUsed[idx]);
                if (usedIdx !== -1) state.anaLetterUsed[usedIdx] = false;
                state.anaSlots[i] = null;
                renderAnagram();
            });
        });

        document.getElementById('anaCheck').addEventListener('click', checkAnagram);
    }

    function getHint(i) {
        const hints = ['Школьная принадлежность для ручек и карандашей.', 'Холодная зимняя погода.', 'Её вешают на стену.'];
        return hints[i] || '';
    }

    function checkAnagram() {
        if (state.anaSlots.some(s => s === null)) { showToast('Заполни все буквы!', 'error'); return; }
        const word = VOCAB_WORDS[state.anaWordIndex];
        const assembled = state.anaSlots.join('');
        if (assembled === word) {
            state.anaSolvedWords[state.anaWordIndex] = true;
            showToast(`Верно! «${word}» ✨`, 'success');
            const slotsBox = document.getElementById('slotsBox');
            if (slotsBox) slotsBox.querySelectorAll('.slot').forEach(s => s.classList.add('done'));
            setTimeout(() => { state.anaWordIndex++; loadAnagramWord(); }, 1400);
        } else {
            showToast('Не то слово. Попробуй ещё!', 'error');
        }
    }

    function renderAnagramSolved() {
        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>

                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="victory-crest" style="font-size:clamp(3rem,8vw,5rem);">📜</div>
                    <div class="screen-title">Все слова собраны!</div>
                    <div class="anagram-label" style="font-size:clamp(1rem,1.5vw,1.3rem); color:#ffd96b; font-style:normal;">${VOCAB_WORDS.join(' · ')}</div>
                    <button class="btn gold" id="backBtn2" style="margin-top:14px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('backBtn2').addEventListener('click', renderMenu);
    }

    // ========== ИСПЫТАНИЕ 2: СОСТАВЛЕНИЕ ==========
    function startCompose() {
        state.composeIndex = 0;
        loadComposeTask();
    }

    function loadComposeTask() {
        if (state.composeIndex >= SENTENCE_TASKS.length) {
            state.completed.compose = true;
            showToast('Испытание «Предложения» пройдено! 🎉', 'success');
            renderComposeSolved();
            return;
        }
        const task = SENTENCE_TASKS[state.composeIndex];
        state.composeZoneWords = [];
        state.composeBankWords = shuffle([...task.words]);
        renderCompose();
    }

    function renderCompose() {
        const task = SENTENCE_TASKS[state.composeIndex];
        const total = SENTENCE_TASKS.length;

        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">✍️ Испытание 2: Предложения</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="compose-area">
                    <div class="compose-prompt">${task.prompt} (${state.composeIndex + 1} из ${total})</div>
                    <div class="drop-zone" id="dropZone">
                        ${state.composeZoneWords.length === 0
                            ? '<span class="placeholder">Перетащи сюда слова по порядку</span>'
                            : state.composeZoneWords.map((w, i) => `<div class="word-chip in-zone" draggable="true" data-zone-idx="${i}">${w}</div>`).join('')}
                    </div>
                    <div class="word-bank" id="wordBank">
                        ${state.composeBankWords.map((w, i) => `<div class="word-chip" draggable="true" data-bank-idx="${i}">${w}</div>`).join('')}
                    </div>
                    <div class="compose-actions">
                        <button class="btn" id="composeReset">↺ Сбросить</button>
                        <button class="btn gold" id="composeCheck">Проверить</button>
                    </div>
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('composeReset').addEventListener('click', () => {
            state.composeZoneWords = [];
            state.composeBankWords = shuffle([...task.words]);
            renderCompose();
        });
        document.getElementById('composeCheck').addEventListener('click', checkCompose);
        setupDragDrop();
    }

    function setupDragDrop() {
        const dropZone = document.getElementById('dropZone');
        const bank = document.getElementById('wordBank');
        let draggedData = null;

        document.querySelectorAll('.word-chip').forEach(chip => {
            chip.addEventListener('dragstart', () => {
                chip.classList.add('dragging');
                if (chip.dataset.bankIdx !== undefined) draggedData = { from: 'bank', idx: parseInt(chip.dataset.bankIdx) };
                else if (chip.dataset.zoneIdx !== undefined) draggedData = { from: 'zone', idx: parseInt(chip.dataset.zoneIdx) };
            });
            chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
            chip.addEventListener('click', () => {
                if (chip.dataset.bankIdx !== undefined) {
                    const idx = parseInt(chip.dataset.bankIdx);
                    const word = state.composeBankWords[idx];
                    state.composeBankWords.splice(idx, 1);
                    state.composeZoneWords.push(word);
                    renderCompose();
                } else if (chip.dataset.zoneIdx !== undefined) {
                    const idx = parseInt(chip.dataset.zoneIdx);
                    const word = state.composeZoneWords[idx];
                    state.composeZoneWords.splice(idx, 1);
                    state.composeBankWords.push(word);
                    renderCompose();
                }
            });
        });

        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
        dropZone.addEventListener('drop', e => {
            e.preventDefault(); dropZone.classList.remove('drag-over');
            if (!draggedData) return;
            if (draggedData.from === 'bank') {
                const word = state.composeBankWords[draggedData.idx];
                state.composeBankWords.splice(draggedData.idx, 1);
                state.composeZoneWords.push(word);
            }
            draggedData = null;
            renderCompose();
        });

        bank.addEventListener('dragover', e => e.preventDefault());
        bank.addEventListener('drop', e => {
            e.preventDefault();
            if (!draggedData) return;
            if (draggedData.from === 'zone') {
                const word = state.composeZoneWords[draggedData.idx];
                state.composeZoneWords.splice(draggedData.idx, 1);
                state.composeBankWords.push(word);
            }
            draggedData = null;
            renderCompose();
        });
    }

    function checkCompose() {
        const task = SENTENCE_TASKS[state.composeIndex];
        if (state.composeZoneWords.length !== task.answer.length) { showToast('Используй все слова!', 'error'); return; }
        const isCorrect = state.composeZoneWords.every((w, i) => w === task.answer[i]);
        if (isCorrect) {
            showToast('Верно! Молодец! ✨', 'success');
            setTimeout(() => { state.composeIndex++; loadComposeTask(); }, 1200);
        } else {
            showToast('Порядок слов неверный. Попробуй ещё!', 'error');
        }
    }

    function renderComposeSolved() {
        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">✍️ Испытание 2: Предложения</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="victory-crest" style="font-size:clamp(3rem,8vw,5rem);">✍️</div>
                    <div class="screen-title">Все предложения составлены!</div>
                    <button class="btn gold" id="backBtn2" style="margin-top:14px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('backBtn2').addEventListener('click', renderMenu);
    }

    // ========== ИСПЫТАНИЕ 3: ПРАВДА/ЛОЖЬ ==========
    function startTrueFalse() {
        state.tfAnswers = {};
        state.tfLocked = false;
        renderTrueFalse();
    }

    function renderTrueFalse() {
        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">⚖️ Испытание 3: Правда и ложь</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="tf-list" id="tfList">
                    ${TF_STATEMENTS.map((st, i) => {
                        const sel = state.tfAnswers[i];
                        return `
                            <div class="tf-item" data-idx="${i}">
                                <div class="tf-text">${st.text}</div>
                                <div class="tf-controls">
                                    <div class="tf-btn ${sel === true ? 'selected-true' : ''} ${state.tfLocked ? 'locked' : ''}" data-idx="${i}" data-val="true" title="Правда">
                                        ✔${sel === true ? '<div class="check-mark">✓</div>' : ''}
                                    </div>
                                    <div class="tf-btn ${sel === false ? 'selected-false' : ''} ${state.tfLocked ? 'locked' : ''}" data-idx="${i}" data-val="false" title="Ложь">
                                        ✘${sel === false ? '<div class="check-mark">✓</div>' : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                <div class="compose-actions" style="margin-top:8px;">
                    ${!state.tfLocked
                        ? `<button class="btn gold" id="tfCheck">Проверить</button>`
                        : `<button class="btn gold" id="tfNext">В меню</button>`}
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);

        if (!state.tfLocked) {
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    state.tfAnswers[idx] = btn.dataset.val === 'true';
                    renderTrueFalse();
                });
            });
            document.getElementById('tfCheck').addEventListener('click', checkTrueFalse);
        } else {
            document.getElementById('tfNext').addEventListener('click', renderMenu);
        }
    }

    function checkTrueFalse() {
        const total = TF_STATEMENTS.length;
        if (Object.keys(state.tfAnswers).length < total) { showToast('Отметь галочками все утверждения!', 'error'); return; }
        state.tfLocked = true;
        renderTrueFalse();
        setTimeout(() => {
            let allCorrect = true;
            document.querySelectorAll('.tf-item').forEach(item => {
                const idx = parseInt(item.dataset.idx);
                const userAns = state.tfAnswers[idx];
                const correct = TF_STATEMENTS[idx].isTrue;
                if (userAns === correct) item.classList.add('correct');
                else { item.classList.add('wrong'); allCorrect = false; }
            });
            if (allCorrect) {
                state.completed.truefalse = true;
                showToast('Все ответы верные! Испытание пройдено! 🎉', 'success');
            } else {
                showToast('Есть ошибки. Попробуй снова!', 'error');
                setTimeout(() => { state.tfLocked = false; renderTrueFalse(); }, 2500);
            }
        }, 100);
    }

    // ============================================================
    // ========== ИСПЫТАНИЕ 4: КОЛЕСО ФОРТУНЫ ==========
    // ============================================================
    function startWheel() {
        state.wheelRotation = 0;
        state.wheelSpinning = false;
        state.wheelTask = null;
        state.wheelAnswered = false;
        state.wheelSolved = 0;
        renderWheel();
    }

    function renderWheel() {
        const total = WHEEL_TASKS.length;
        const sectorAngle = 360 / total;

        // Построим SVG-сектора колеса
        const colors = ['#1a3d2a', '#2a5a3a', '#8a6d24', '#1a3d2a', '#2a5a3a', '#8a6d24', '#1a3d2a', '#2a5a3a'];
        let sectors = '';
        for (let i = 0; i < total; i++) {
            const startAngle = i * sectorAngle - 90;
            const endAngle = startAngle + sectorAngle;
            const largeArc = sectorAngle > 180 ? 1 : 0;
            const rad1 = startAngle * Math.PI / 180;
            const rad2 = endAngle * Math.PI / 180;
            const x1 = 100 + 100 * Math.cos(rad1);
            const y1 = 100 + 100 * Math.sin(rad1);
            const x2 = 100 + 100 * Math.cos(rad2);
            const y2 = 100 + 100 * Math.sin(rad2);
            sectors += `<path d="M 100 100 L ${x1.toFixed(2)} ${y1.toFixed(2)} A 100 100 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${colors[i]}" stroke="#6b4f1d" stroke-width="1.5"/>`;
            // Номер сектора
            const midAngle = startAngle + sectorAngle / 2;
            const midRad = midAngle * Math.PI / 180;
            const tx = 100 + 65 * Math.cos(midRad);
            const ty = 100 + 65 * Math.sin(midRad);
            sectors += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#ffd96b" style="paint-order: stroke; stroke: #4a3512; stroke-width: 3px;">${i + 1}</text>`;
        }

        // HTML для карточки задания
        let taskHTML = '';
        if (state.wheelTask) {
            const task = state.wheelTask;
            // Собираем слово с подсвеченным пропуском
            const wordHTML = task.display.split('').map(ch => {
                if (ch === '_') {
                    return `<span class="missing">_</span>`;
                }
                return ch;
            }).join('');

            taskHTML = `
                <div class="task-card">
                    <div class="task-label">✍️ Вставь пропущенную букву</div>
                    <div class="task-word" id="taskWord">${wordHTML}</div>
                    <div class="task-hint">${task.hint}</div>
                    <div class="letter-options" id="letterOptions">
                        ${task.options.map(opt => `
                            <button class="letter-option" data-letter="${opt}">${opt}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        } else {
            taskHTML = `
                <div class="task-card">
                    <div class="task-label">🎡 Крути колесо!</div>
                    <div class="task-hint">Нажми «Крутить», чтобы получить задание на орфографию.</div>
                </div>
            `;
        }

        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">🎡 Испытание 4: Колесо Фортуны</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="wheel-area">
                    <div class="wheel-top">
                        <div class="wheel-hint">Решено: <b style="color:#ffd96b;">${state.wheelSolved}</b> из ${WHEEL_TARGET}</div>
                    </div>
                    <div class="wheel-container">
                        <div class="wheel-pointer"></div>
                        <div class="wheel" id="wheel" style="transform: rotate(${state.wheelRotation}deg);">
                            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                                ${sectors}
                            </svg>
                        </div>
                        <div class="wheel-hub">🎯</div>
                    </div>
                    <button class="btn gold wheel-spin-btn" id="spinBtn" ${state.wheelSpinning || state.wheelTask ? 'disabled' : ''}>
                        ${state.wheelSpinning ? 'Крутится…' : (state.wheelTask ? 'Отгадай букву' : '🎡 Крутить')}
                    </button>
                    ${taskHTML}
                </div>
            </div>
        `;

        document.getElementById('backBtn').addEventListener('click', renderMenu);

        const spinBtn = document.getElementById('spinBtn');
        if (spinBtn && !state.wheelSpinning && !state.wheelTask) {
            spinBtn.addEventListener('click', spinWheel);
        }

        // Обработчики для букв
        if (state.wheelTask && !state.wheelAnswered) {
            document.querySelectorAll('.letter-option').forEach(btn => {
                btn.addEventListener('click', () => chooseLetter(btn.dataset.letter));
            });
        }
    }

    function spinWheel() {
        if (state.wheelSpinning || state.wheelTask) return;
        state.wheelSpinning = true;

        // Выбираем случайное задание
        const taskIdx = Math.floor(Math.random() * WHEEL_TASKS.length);
        const task = WHEEL_TASKS[taskIdx];

        // Выбираем случайное вращение: 5-8 полных оборотов + угол до нужного сектора
        const total = WHEEL_TASKS.length;
        const sectorAngle = 360 / total;
        // Нужно, чтобы верхний указатель (при 0° он смотрит вверх, что соответствует началу первого сектора)
        // попал в середину выбранного сектора. У нас сектор i начинается с угла i*sectorAngle - 90 (в SVG).
        // Стрелка сверху указывает на -90° (то есть на верх). Хотим, чтобы середина сектора taskIdx
        // оказалась наверху. Значит, колесо надо повернуть на -(taskIdx*sectorAngle + sectorAngle/2) + 360*k.
        const targetAngle = 360 * 6 - (taskIdx * sectorAngle + sectorAngle / 2);
        const finalRotation = state.wheelRotation + (targetAngle - (state.wheelRotation % 360)) + 360 * 3;

        // Плавно крутим
        const wheelEl = document.getElementById('wheel');
        if (wheelEl) {
            wheelEl.style.transform = `rotate(${finalRotation}deg)`;
        }
        state.wheelRotation = finalRotation;

        // Запускаем выбор букв и показ задания после остановки
        setTimeout(() => {
            state.wheelSpinning = false;
            state.wheelTask = task;
            state.wheelAnswered = false;
            renderWheel();
        }, 4100); // 4s transition + запас
    }

    function chooseLetter(letter) {
        if (!state.wheelTask || state.wheelAnswered) return;
        state.wheelAnswered = true;
        const task = state.wheelTask;
        const isCorrect = letter === task.missing;

        // Подсветим варианты
        document.querySelectorAll('.letter-option').forEach(btn => {
            btn.disabled = true;
            if (btn.dataset.letter === task.missing) btn.classList.add('correct');
            else if (btn.dataset.letter === letter && !isCorrect) btn.classList.add('wrong');
        });

        // Обновим слово — покажем правильную букву
        const taskWordEl = document.getElementById('taskWord');
        if (taskWordEl) {
            const parts = task.display.split('');
            let newHTML = '';
            parts.forEach((ch) => {
                if (ch === '_') {
                    newHTML += `<span class="missing ${isCorrect ? 'filled-ok' : 'filled-bad'}">${task.missing}</span>`;
                } else {
                    newHTML += ch;
                }
            });
            taskWordEl.innerHTML = newHTML;
        }

        if (isCorrect) {
            state.wheelSolved++;
            showToast(`Верно! «${task.full}» ✨`, 'success');

            if (state.wheelSolved >= WHEEL_TARGET) {
                setTimeout(() => {
                    state.completed.wheel = true;
                    showToast('Испытание «Колесо Фортуны» пройдено! 🎉', 'success');
                    renderWheelSolved();
                }, 1300);
                return;
            }

            // Продолжим — вернём кнопку «Крутить»
            setTimeout(() => {
                state.wheelTask = null;
                state.wheelAnswered = false;
                renderWheel();
            }, 1500);
        } else {
            showToast(`Ошибка. Правильная буква: ${task.missing}`, 'error');
            // Через 2 секунды вернём возможность крутить снова
            setTimeout(() => {
                state.wheelTask = null;
                state.wheelAnswered = false;
                renderWheel();
            }, 2200);
        }
    }

    function renderWheelSolved() {
        app.innerHTML = `
            <div class="screen">
                <div class="screen-header">
                    <button class="back-btn" id="backBtn">← В меню</button>
                    <div class="screen-title">🎡 Испытание 4: Колесо Фортуны</div>
                    <div style="width:90px;"></div>
                </div>
                <div class="anagram-board">
                    <div class="victory-crest" style="font-size:clamp(3rem,8vw,5rem);">🎡</div>
                    <div class="screen-title">Колесо остановлено!</div>
                    <div class="anagram-label" style="font-size:clamp(1rem,1.5vw,1.3rem); color:#ffd96b; font-style:normal;">
                        Ты верно вставил ${WHEEL_TARGET} пропущенных букв!
                    </div>
                    <button class="btn gold" id="backBtn2" style="margin-top:14px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('backBtn').addEventListener('click', renderMenu);
        document.getElementById('backBtn2').addEventListener('click', renderMenu);
    }

    // ========== ФИНАЛ ==========
    function renderVictory() {
        app.innerHTML = `
            <div class="screen">
                <div class="victory-screen">
                    <div class="victory-crest">🏆</div>
                    <div class="victory-title">Все испытания пройдены!</div>
                    <div class="victory-sub">
                        Ты справился со словарными словами, составил предложения, отличил правду от лжи и вставил пропущенные буквы.
                        Хогвартс гордится тобой, юный волшебник! ⚡
                    </div>
                    <button class="btn gold" id="toMenu" style="margin-top:12px;">← Вернуться в меню</button>
                </div>
            </div>
        `;
        document.getElementById('toMenu').addEventListener('click', renderMenu);
    }

    // ========== СТАРТ ==========
    renderMenu();
})();
</script>
</body>
</html>
