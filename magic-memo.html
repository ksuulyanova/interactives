
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магические предложения — Хогвартс</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        height: 100%;
        font-family: 'Georgia', 'Times New Roman', serif;
    }

    body {
        background-color: #0a1f14;
        background-image: url('https://i.pinimg.com/736x/1a/8c/32/1a8c32c1edc122942a4db2c973be0b97.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        position: relative;
    }

    /* Затемнение фона без обрезки */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(10, 30, 20, 0.45) 0%, rgba(5, 15, 10, 0.75) 100%);
        pointer-events: none;
        z-index: 0;
    }

    .game-wrapper {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 900px;
        background: linear-gradient(160deg, #f5ecd0 0%, #ede0bd 100%);
        border: 4px solid #b8963e;
        outline: 2px solid #6b4f1d;
        outline-offset: 6px;
        border-radius: 12px;
        padding: 28px 32px 34px;
        box-shadow: 
            0 0 0 2px #d4b968,
            0 20px 50px rgba(0, 0, 0, 0.6),
            inset 0 0 60px rgba(184, 150, 62, 0.15);
        /* Пергаментная текстура */
        background-image: 
            linear-gradient(160deg, #f5ecd0 0%, #ede0bd 100%),
            repeating-linear-gradient(45deg, transparent, transparent 3px, rgba(184,150,62,0.04) 3px, rgba(184,150,62,0.04) 6px);
        background-blend-mode: multiply;
    }

    /* Уголки-декор */
    .game-wrapper::before,
    .game-wrapper::after {
        content: '✦';
        position: absolute;
        font-size: 20px;
        color: #b8963e;
        text-shadow: 0 0 8px rgba(184, 150, 62, 0.8);
    }
    .game-wrapper::before { top: 8px; left: 14px; }
    .game-wrapper::after { top: 8px; right: 14px; }

    /* Заголовок */
    h1 {
        text-align: center;
        font-family: 'Georgia', serif;
        font-size: 1.75rem;
        font-weight: 700;
        color: #2d1f0a;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        padding-bottom: 12px;
        margin-bottom: 16px;
        border-bottom: 2px solid #b8963e;
        position: relative;
        text-shadow: 1px 1px 0 rgba(184, 150, 62, 0.4);
    }

    h1::after {
        content: '⚡';
        position: absolute;
        bottom: -13px;
        left: 50%;
        transform: translateX(-50%);
        background: #ede0bd;
        padding: 0 12px;
        color: #b8963e;
        font-size: 18px;
    }

    /* Панель статистики */
    .stats {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 22px;
    }

    .stat-box {
        flex: 1;
        background: linear-gradient(145deg, #1a3d2a, #0f2a1c);
        border: 2px solid #b8963e;
        border-radius: 10px;
        padding: 10px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #e8d99a;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        box-shadow: 
            inset 0 2px 8px rgba(0,0,0,0.5),
            0 4px 0 #6b4f1d;
    }

    .stat-icon { font-size: 1.4rem; }

    .stat-value {
        color: #fff3c4;
        font-size: 1.4rem;
        min-width: 55px;
        text-align: center;
        text-shadow: 0 0 10px rgba(184, 150, 62, 0.9);
    }

    .stat-box.danger {
        border-color: #d44a3a;
        box-shadow: inset 0 2px 8px rgba(0,0,0,0.5), 0 4px 0 #7a2a1e;
    }
    .stat-box.danger .stat-value { color: #ffb3a8; text-shadow: 0 0 10px rgba(212, 74, 58, 0.9); }

    /* Карточка персонажа */
    .character-card {
        display: flex;
        align-items: flex-end;
        gap: 20px;
        margin-bottom: 22px;
        background: rgba(255, 250, 230, 0.5);
        border: 2px dashed #b8963e;
        border-radius: 14px;
        padding: 16px 20px;
        position: relative;
    }

    .character-portrait {
        flex-shrink: 0;
        width: 110px;
        height: 130px;
        border-radius: 12px;
        border: 3px solid #b8963e;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3), inset 0 0 20px rgba(0,0,0,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4.5rem;
        background: linear-gradient(145deg, #2a4a35, #16301f);
        overflow: hidden;
        position: relative;
    }

    .character-portrait::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 60%, rgba(184,150,62,0.2));
        pointer-events: none;
    }

    .character-name {
        font-size: 0.85rem;
        color: #fff3c4;
        text-transform: uppercase;
        letter-spacing: 1px;
        position: absolute;
        bottom: 6px;
        left: 0;
        right: 0;
        text-align: center;
        background: rgba(10, 30, 20, 0.8);
        padding: 3px 0;
        font-weight: 700;
    }

    .speech-bubble {
        flex: 1;
        background: #ffffff;
        border: 3px solid #b8963e;
        border-radius: 16px 16px 16px 4px;
        padding: 20px 24px;
        font-size: 1.35rem;
        color: #1a2a1a;
        line-height: 1.5;
        font-weight: 600;
        position: relative;
        box-shadow: 0 6px 0 rgba(107, 79, 29, 0.35);
        min-height: 90px;
        display: flex;
        align-items: center;
    }

    .speech-bubble::before {
        content: '';
        position: absolute;
        left: -17px;
        bottom: 18px;
        width: 0;
        height: 0;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        border-right: 18px solid #b8963e;
    }

    .speech-bubble::after {
        content: '';
        position: absolute;
        left: -10px;
        bottom: 20px;
        width: 0;
        height: 0;
        border-top: 11px solid transparent;
        border-bottom: 11px solid transparent;
        border-right: 14px solid #ffffff;
    }

    /* Кнопки ответов */
    .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 18px;
    }

    .option-btn {
        background: linear-gradient(145deg, #1a3d2a, #123322);
        color: #f0e6c0;
        border: 2px solid #b8963e;
        border-radius: 10px;
        padding: 15px 22px;
        font-size: 1.15rem;
        font-weight: 700;
        font-family: 'Georgia', serif;
        letter-spacing: 0.5px;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 5px 0 #6b4f1d, 0 6px 12px rgba(0,0,0,0.25);
        text-align: left;
        position: relative;
        overflow: hidden;
    }

    .option-btn::before {
        content: attr(data-letter);
        display: inline-block;
        width: 30px;
        height: 30px;
        line-height: 30px;
        text-align: center;
        background: #b8963e;
        color: #1a2a1a;
        border-radius: 50%;
        margin-right: 14px;
        font-weight: 900;
        font-size: 0.95rem;
        box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3);
    }

    .option-btn:hover:not(:disabled) {
        background: linear-gradient(145deg, #23573b, #1a422b);
        transform: translateY(-2px);
        box-shadow: 0 7px 0 #6b4f1d, 0 9px 18px rgba(0,0,0,0.3);
        border-color: #d4b968;
    }

    .option-btn:active:not(:disabled) {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #6b4f1d;
    }

    .option-btn:disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }

    .option-btn.correct {
        background: linear-gradient(145deg, #1e6b3a, #14532a) !important;
        border-color: #4fd97a !important;
        box-shadow: 0 5px 0 #0d3a1c, 0 0 20px rgba(79, 217, 122, 0.5) !important;
        animation: pulse-green 0.6s ease;
    }

    .option-btn.wrong {
        background: linear-gradient(145deg, #6b1e1e, #4a1414) !important;
        border-color: #d44a3a !important;
        box-shadow: 0 5px 0 #3a0d0d, 0 0 20px rgba(212, 74, 58, 0.5) !important;
        animation: shake 0.4s ease;
    }

    @keyframes pulse-green {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        75% { transform: translateX(6px); }
    }

    /* Обратная связь */
    .feedback {
        text-align: center;
        font-size: 1.2rem;
        font-weight: 700;
        min-height: 2.5rem;
        padding: 6px 0;
        color: #2d1f0a;
        letter-spacing: 0.3px;
        font-style: italic;
    }

    /* Кнопка далее */
    .next-btn {
        display: block;
        margin: 8px auto 0;
        background: linear-gradient(145deg, #b8963e, #8a6d24);
        color: #1a2a1a;
        border: 2px solid #6b4f1d;
        border-radius: 40px;
        padding: 14px 50px;
        font-size: 1.25rem;
        font-weight: 800;
        font-family: 'Georgia', serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 5px 0 #4a3512, 0 8px 16px rgba(0,0,0,0.3);
        transition: all 0.15s ease;
    }

    .next-btn:hover:not(:disabled) {
        background: linear-gradient(145deg, #d4b968, #a8852e);
        transform: translateY(-2px);
        box-shadow: 0 7px 0 #4a3512, 0 10px 20px rgba(0,0,0,0.35);
    }

    .next-btn:active:not(:disabled) {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #4a3512;
    }

    .next-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: translateY(3px);
        box-shadow: 0 2px 0 #4a3512;
    }

    /* Финальный экран */
    .finish-screen {
        text-align: center;
        padding: 30px 10px 20px;
    }

    .finish-screen h2 {
        font-family: 'Georgia', serif;
        font-size: 2.2rem;
        color: #2d1f0a;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 15px;
        text-shadow: 2px 2px 0 rgba(184, 150, 62, 0.5);
    }

    .finish-crest {
        font-size: 4rem;
        margin: 10px 0 20px;
        filter: drop-shadow(0 4px 10px rgba(184, 150, 62, 0.7));
    }

    .finish-score {
        display: inline-block;
        background: linear-gradient(145deg, #1a3d2a, #0f2a1c);
        border: 3px solid #b8963e;
        color: #fff3c4;
        font-size: 2rem;
        font-weight: 800;
        padding: 18px 50px;
        border-radius: 14px;
        margin: 10px 0 22px;
        box-shadow: 0 6px 0 #6b4f1d, 0 10px 30px rgba(0,0,0,0.5);
        letter-spacing: 1px;
    }

    .finish-message {
        font-size: 1.3rem;
        color: #2d1f0a;
        margin-bottom: 30px;
        font-style: italic;
        font-weight: 600;
    }

    .restart-btn {
        background: linear-gradient(145deg, #b8963e, #8a6d24);
        color: #1a2a1a;
        border: 2px solid #6b4f1d;
        border-radius: 40px;
        padding: 15px 45px;
        font-size: 1.25rem;
        font-weight: 800;
        font-family: 'Georgia', serif;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 5px 0 #4a3512, 0 8px 16px rgba(0,0,0,0.3);
        transition: all 0.15s ease;
    }

    .restart-btn:hover {
        background: linear-gradient(145deg, #d4b968, #a8852e);
        transform: translateY(-2px);
        box-shadow: 0 7px 0 #4a3512, 0 10px 20px rgba(0,0,0,0.35);
    }

    /* Прогресс */
    .progress-bar {
        height: 6px;
        background: rgba(107, 79, 29, 0.25);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 18px;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #b8963e, #d4b968);
        border-radius: 3px;
        transition: width 0.4s ease;
        box-shadow: 0 0 8px rgba(184, 150, 62, 0.8);
    }

    /* Адаптив */
    @media (max-width: 700px) {
        .game-wrapper {
            padding: 20px 18px 26px;
            outline-offset: 4px;
        }
        h1 { font-size: 1.3rem; letter-spacing: 0.8px; }
        .character-card { flex-direction: column; align-items: center; }
        .character-portrait { width: 90px; height: 105px; font-size: 3.5rem; }
        .speech-bubble { font-size: 1.1rem; padding: 16px 18px; width: 100%; }
        .speech-bubble::before, .speech-bubble::after { display: none; }
        .option-btn { font-size: 1rem; padding: 12px 16px; }
        .option-btn::before { width: 26px; height: 26px; line-height: 26px; font-size: 0.85rem; }
        .stat-box { font-size: 0.95rem; padding: 8px 12px; }
        .stat-value { font-size: 1.15rem; }
        .finish-screen h2 { font-size: 1.6rem; }
        .finish-score { font-size: 1.5rem; padding: 14px 30px; }
    }

    @media (max-width: 450px) {
        .stats { flex-direction: column; gap: 8px; }
    }
</style>
</head>
<body>
<div class="game-wrapper" id="gameWrapper"></div>

<script>
(function() {
    // ========== ПЕРСОНАЖИ ГАРРИ ПОТТЕРА ==========
    const CHARACTERS = [
        { name: 'Гарри Поттер', avatar: '⚡', symbol: '⚡', color: '#7b1a1a' },
        { name: 'Гермиона Грейнджер', avatar: '📖', symbol: '📖', color: '#6b3fa0' },
        { name: 'Рон Уизли', avatar: '🧡', symbol: '🧡', color: '#c45a1a' },
        { name: 'Альбус Дамблдор', avatar: '🧙', symbol: '🧙', color: '#4a6fa5' },
        { name: 'Рубеус Хагрид', avatar: '🐉', symbol: '🐉', color: '#5a3a1a' },
        { name: 'Драко Малфой', avatar: '🐍', symbol: '🐍', color: '#2d5a2d' },
        { name: 'Северус Снейп', avatar: '🦇', symbol: '🦇', color: '#1a1a2e' },
        { name: 'Добби', avatar: '🧦', symbol: '🧦', color: '#8a6d24' },
        { name: 'Минерва Макгонагалл', avatar: '🦁', symbol: '🦁', color: '#7a1f1f' },
        { name: 'Луна Лавгуд', avatar: '🌙', symbol: '🌙', color: '#5a7a9a' }
    ];

    // ========== ПРЕДЛОЖЕНИЯ ==========
    const SENTENCES = [
        { text: 'Гарри поймал золотой снитч.', type: 'Простое' },
        { text: 'Гермиона читала книгу, а Рон ел пирожное.', type: 'Сложное' },
        { text: 'В Хогвартсе есть Гриффиндор, Слизерин, Когтевран и Пуффендуй.', type: 'Простое с однородными членами предложения' },
        { text: 'Дамблдор улыбнулся, и глаза его сверкнули.', type: 'Сложное' },
        { text: 'Хагрид принёс сову и письмо.', type: 'Простое с однородными членами предложения' },
        { text: 'Снейп варил зелье в подземелье.', type: 'Простое' },
        { text: 'Драко засмеялся, но Гарри не обратил внимания.', type: 'Сложное' },
        { text: 'На столе лежали волшебная палочка, мантия и карта.', type: 'Простое с однородными членами предложения' },
        { text: 'Добби щёлкнул пальцами, и посуда сама помылась.', type: 'Сложное' },
        { text: 'Луна надела очки из пробок.', type: 'Простое' },
        { text: 'Студенты пели, танцевали и веселились в Большом зале.', type: 'Простое с однородными членами предложения' },
        { text: 'Букля принесла письмо, и Гарри прочитал его.', type: 'Сложное' },
        { text: 'Макгонагалл строго посмотрела на учеников.', type: 'Простое' },
        { text: 'Волшебники летали на мётлах и играли в квиддич.', type: 'Простое с однородными членами предложения' },
        { text: 'Наступила ночь, и звёзды зажглись над башней.', type: 'Сложное' },
        { text: 'Феникс вспыхнул и возродился из пепла.', type: 'Простое с однородными членами предложения' }
    ];

    const OPTIONS = [
        { label: 'Простое', value: 'Простое', letter: 'А' },
        { label: 'Сложное', value: 'Сложное', letter: 'Б' },
        { label: 'Простое с однородными членами', value: 'Простое с однородными членами предложения', letter: 'В' }
    ];

    const TIMER_START = 90;

    // ========== СОСТОЯНИЕ ==========
    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let timeLeft = TIMER_START;
    let timerInterval = null;
    let answered = false;
    let gameActive = true;
    let currentSentence = null;
    let currentCharacter = null;

    const wrapper = document.getElementById('gameWrapper');

    // ========== УТИЛИТЫ ==========
    function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function formatTime(sec) {
        return `${sec}с`;
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
    }

    function startTimer() {
        stopTimer();
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            if (timeLeft <= 1) {
                timeLeft = 0;
                updateTimerDisplay();
                stopTimer();
                gameActive = false;
                renderGameOver();
                return;
            }
            timeLeft--;
            updateTimerDisplay();
        }, 1000);
    }

    function updateTimerDisplay() {
        const el = document.getElementById('timerValue');
        if (el) el.textContent = formatTime(timeLeft);
        const box = document.getElementById('timerBox');
        if (box) {
            if (timeLeft <= 15) box.classList.add('danger');
            else box.classList.remove('danger');
        }
    }

    function updateScoreDisplay() {
        const el = document.getElementById('scoreValue');
        if (el) el.textContent = score;
    }

    // ========== ИГРА ==========
    function resetGame() {
        stopTimer();
        questions = shuffle(SENTENCES);
        currentIndex = 0;
        score = 0;
        timeLeft = TIMER_START;
        answered = false;
        gameActive = true;
        updateScoreDisplay();
        updateTimerDisplay();
        startTimer();
        renderQuestion();
    }

    function renderQuestion() {
        if (!gameActive) return;
        if (currentIndex >= questions.length) {
            gameActive = false;
            stopTimer();
            renderFinish(true);
            return;
        }

        currentSentence = questions[currentIndex];
        currentCharacter = CHARACTERS[Math.floor(Math.random() * CHARACTERS.length)];
        answered = false;

        const progressPercent = (currentIndex / questions.length) * 100;

        wrapper.innerHTML = `
            <h1>⚡ Магические предложения ⚡</h1>

            <div class="stats">
                <div class="stat-box" id="timerBox">
                    <span class="stat-icon">⏳</span>
                    <span>Время:</span>
                    <span class="stat-value" id="timerValue">${formatTime(timeLeft)}</span>
                </div>
                <div class="stat-box">
                    <span class="stat-icon">🏆</span>
                    <span>Баллы:</span>
                    <span class="stat-value" id="scoreValue">${score}</span>
                </div>
                <div class="stat-box">
                    <span class="stat-icon">📜</span>
                    <span>Вопрос:</span>
                    <span class="stat-value">${currentIndex + 1}/${questions.length}</span>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" style="width: ${progressPercent}%"></div>
            </div>

            <div class="character-card">
                <div class="character-portrait" style="background: linear-gradient(145deg, ${currentCharacter.color}, #0a1f14);">
                    <span>${currentCharacter.avatar}</span>
                    <div class="character-name">${currentCharacter.name}</div>
                </div>
                <div class="speech-bubble">
                    ${currentSentence.text}
                </div>
            </div>

            <div class="options" id="optionsContainer">
                ${OPTIONS.map(opt => `
                    <button class="option-btn" data-value="${opt.value}" data-letter="${opt.letter}">
                        ${opt.label}
                    </button>
                `).join('')}
            </div>

            <div class="feedback" id="feedbackMessage"></div>

            <button class="next-btn" id="nextBtn" disabled>Далее ➜</button>
        `;

        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.addEventListener('click', onOptionClick);
        });

        const nextBtn = document.getElementById('nextBtn');
        nextBtn.addEventListener('click', onNextClick);

        updateTimerDisplay();
        updateScoreDisplay();
    }

    function onOptionClick(event) {
        if (answered || !gameActive) return;

        const selectedBtn = event.currentTarget;
        const selectedValue = selectedBtn.dataset.value;
        const isCorrect = (selectedValue === currentSentence.type);
        answered = true;

        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.disabled = true;
            if (btn.dataset.value === currentSentence.type) {
                btn.classList.add('correct');
            } else if (btn === selectedBtn && !isCorrect) {
                btn.classList.add('wrong');
            }
        });

        if (isCorrect) {
            score += 10;
            updateScoreDisplay();
        }

        const feedback = document.getElementById('feedbackMessage');
        if (isCorrect) {
            feedback.textContent = `✅ Верно! +10 баллов. ${currentCharacter.name} гордится тобой!`;
            feedback.style.color = '#1e5a1e';
        } else {
            feedback.textContent = `❌ Неверно. Правильный ответ: «${currentSentence.type}»`;
            feedback.style.color = '#8a1e1e';
        }

        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) nextBtn.disabled = false;
    }

    function onNextClick() {
        if (!gameActive || !answered) return;
        currentIndex++;
        if (currentIndex < questions.length) {
            renderQuestion();
        } else {
            gameActive = false;
            stopTimer();
            renderFinish(true);
        }
    }

    function renderGameOver() {
        stopTimer();
        gameActive = false;
        answered = true;
        const allOptions = document.querySelectorAll('.option-btn');
        allOptions.forEach(btn => btn.disabled = true);
        const nextBtn = document.getElementById('nextBtn');
        if (nextBtn) nextBtn.disabled = true;
        renderFinish(false);
    }

    function renderFinish(isWin) {
        stopTimer();
        gameActive = false;

        let title, crest, message;
        if (timeLeft <= 0 && currentIndex < questions.length) {
            title = 'Время вышло!';
            crest = '⏰';
            message = 'Песочные часы остановились. Но ты успел заработать баллы!';
        } else {
            title = 'Испытание пройдено!';
            crest = '🏆';
            message = 'Ты настоящий знаток предложений! Хогвартс гордится тобой.';
        }

        wrapper.innerHTML = `
            <div class="finish-screen">
                <div class="finish-crest">${crest}</div>
                <h2>${title}</h2>
                <div class="finish-score">🏆 ${score} баллов</div>
                <p class="finish-message">${message}</p>
                <button class="restart-btn" id="restartButton">🔄 Сыграть снова</button>
            </div>
        `;

        document.getElementById('restartButton').addEventListener('click', resetGame);
    }

    // ========== СТАРТ ==========
    resetGame();
})();
</script>
</body>
</html>
